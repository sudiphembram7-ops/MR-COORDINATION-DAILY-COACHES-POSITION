<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        MR CO-ORDINATION - PRINT
    </title>

    <style>

        /* =====================================================
           SCREEN
        ===================================================== */

        body{
            margin:0;
            padding:10px;
            font-family:Arial, Helvetica, sans-serif;
            background:#ffffff;
            color:#000;
        }

        .print-container{
            width:100%;
            margin:auto;
        }

        .print-header{
            text-align:center;
            margin-bottom:8px;
        }

        .print-header h1{
            margin:0;
            font-size:18px;
            font-weight:700;
        }

        .print-header h2{
            margin:2px 0 0;
            font-size:13px;
            font-weight:700;
        }

        .print-date{
            margin-top:3px;
            font-size:9px;
        }


        /* =====================================================
           GROUP
        ===================================================== */

        .group{
            margin-bottom:7px;
            page-break-inside:avoid;
        }

        .group-title{
            background:#000;
            color:#fff;
            text-align:center;
            font-size:11px;
            font-weight:700;
            padding:3px 4px;
            margin:0;
            border:1px solid #000;
        }


        /* =====================================================
           TABLE
        ===================================================== */

        table{
            width:100%;
            border-collapse:collapse;
            table-layout:fixed;
            margin:0;
        }

        th,
        td{
            border:1px solid #000;
            text-align:center;
            vertical-align:middle;
            padding:2px 3px;
            line-height:1;
        }

        th{
            background:#e9e9e9;
            font-size:8px;
            font-weight:700;
        }

        td{
            font-size:8px;
            height:15px;
            font-weight:600;
        }


        /* =====================================================
           COLUMN WIDTH
        ===================================================== */

        .shop-col{
            width:18%;
        }

        .line-col{
            width:18%;
        }

        .position-col{
            width:20%;
        }

        .coach-col{
            width:44%;
        }


        /* =====================================================
           EMPTY COACH
        ===================================================== */

        .empty{
            color:#fff;
        }


        /* =====================================================
           PRINT BUTTON
        ===================================================== */

        .print-controls{
            text-align:center;
            margin-bottom:8px;
        }

        .print-btn{
            border:none;
            background:#0d6efd;
            color:#fff;
            padding:7px 18px;
            border-radius:4px;
            font-size:12px;
            cursor:pointer;
        }

        .refresh-btn{
            border:none;
            background:#198754;
            color:#fff;
            padding:7px 18px;
            border-radius:4px;
            font-size:12px;
            cursor:pointer;
            margin-left:5px;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        #loading{
            text-align:center;
            font-size:13px;
            padding:15px;
            font-weight:bold;
        }

        #error{
            text-align:center;
            color:red;
            font-size:12px;
            font-weight:bold;
            padding:10px;
        }


        /* =====================================================
           A4 LANDSCAPE
        ===================================================== */

        @page{
            size:A4 landscape;
            margin:5mm;
        }


        @media print{

            html,
            body{
                width:100%;
                height:100%;
                margin:0;
                padding:0;
                background:#fff;
            }

            .print-controls{
                display:none !important;
            }

            .print-header{
                margin-bottom:4px;
            }

            .print-header h1{
                font-size:14px;
            }

            .print-header h2{
                font-size:10px;
            }

            .print-date{
                font-size:7px;
                margin-top:1px;
            }

            .group{
                margin-bottom:3px;
                page-break-inside:avoid;
                break-inside:avoid;
            }

            .group-title{
                font-size:8px;
                padding:2px;
                line-height:1;
            }

            th,
            td{
                padding:1px 2px;
                line-height:1;
            }

            th{
                font-size:6.5px;
                height:10px;
            }

            td{
                font-size:7px;
                height:11px;
            }

            table{
                page-break-inside:avoid;
                break-inside:avoid;
            }

            #loading,
            #error{
                display:none !important;
            }

        }

    </style>

</head>


<body>


<div class="print-container">


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <div class="print-header">

        <h1>
            MR CO-ORDINATION DAILY COACHES POSITION
        </h1>

        <h2>
            LILUAH WORKSHOP
        </h2>

        <div
            id="printDate"
            class="print-date"
        >
            --
        </div>

    </div>


    <!-- =====================================================
         CONTROLS
    ===================================================== -->

    <div class="print-controls">

        <button
            class="print-btn"
            onclick="window.print()"
        >
            PRINT
        </button>

        <button
            class="refresh-btn"
            onclick="location.reload()"
        >
            REFRESH
        </button>

    </div>


    <!-- =====================================================
         LOADING
    ===================================================== -->

    <div id="loading">
        Loading coach board...
    </div>


    <div id="error"></div>


    <!-- =====================================================
         PRINT AREA
    ===================================================== -->

    <div id="printArea">


        <!-- =================================================
             N SHOP + M SHOP
        ================================================= -->

        <section class="group">

            <div class="group-title">
                N SHOP + M SHOP
            </div>

            <table>

                <thead>

                    <tr>

                        <th class="shop-col">
                            SHOP
                        </th>

                        <th class="line-col">
                            LINE
                        </th>

                        <th class="position-col">
                            POSITION
                        </th>

                        <th class="coach-col">
                            COACH NUMBER
                        </th>

                    </tr>

                </thead>

                <tbody id="nmTable">

                </tbody>

            </table>

        </section>



        <!-- =================================================
             LIFTING BAY + J SHOP
        ================================================= -->

        <section class="group">

            <div class="group-title">
                LIFTING BAY + J SHOP
            </div>

            <table>

                <thead>

                    <tr>

                        <th class="shop-col">
                            SHOP
                        </th>

                        <th class="line-col">
                            LINE
                        </th>

                        <th class="position-col">
                            POSITION
                        </th>

                        <th class="coach-col">
                            COACH NUMBER
                        </th>

                    </tr>

                </thead>

                <tbody id="ljTable">

                </tbody>

            </table>

        </section>



        <!-- =================================================
             MR SCR SHOP
        ================================================= -->

        <section class="group">

            <div class="group-title">
                MR SCR SHOP
            </div>

            <table>

                <thead>

                    <tr>

                        <th class="shop-col">
                            SHOP
                        </th>

                        <th class="line-col">
                            LINE
                        </th>

                        <th class="position-col">
                            POSITION
                        </th>

                        <th class="coach-col">
                            COACH NUMBER
                        </th>

                    </tr>

                </thead>

                <tbody id="scrTable">

                </tbody>

            </table>

        </section>



        <!-- =================================================
             CR SHOP
        ================================================= -->

        <section class="group">

            <div class="group-title">
                CR SHOP
            </div>

            <table>

                <thead>

                    <tr>

                        <th class="shop-col">
                            SHOP
                        </th>

                        <th class="line-col">
                            LINE
                        </th>

                        <th class="position-col">
                            POSITION
                        </th>

                        <th class="coach-col">
                            COACH NUMBER
                        </th>

                    </tr>

                </thead>

                <tbody id="crTable">

                </tbody>

            </table>

        </section>


    </div>

</div>



<!-- =====================================================
     PRINT JS
===================================================== -->

<script
    type="module"
    src="js/print.js"
></script>


</body>

</html>
