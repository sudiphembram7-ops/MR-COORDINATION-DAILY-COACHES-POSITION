<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MR CO-ORDINATION - A4 PRINT</title>

    <link rel="stylesheet" href="./print.css">

</head>


<body>


    <!-- =====================================================
         SCREEN BUTTONS
    ====================================================== -->

    <div class="screenControls">

        <button
            class="printBtn"
            onclick="window.print()"
        >
            PRINT A4
        </button>

        <button
            class="closeBtn"
            onclick="window.close()"
        >
            CLOSE
        </button>

    </div>


    <!-- =====================================================
         LOADING
    ====================================================== -->

    <div id="loading">
        Loading Coach Board...
    </div>


    <!-- =====================================================
         PRINT AREA
    ====================================================== -->

    <main id="printPage">


        <!-- HEADER -->

        <header class="printHeader">

            <div class="mainTitle">
                MR CO-ORDINATION DAILY COACHES POSITION
            </div>

            <div class="workshopTitle">
                LILUAH WORKSHOP
            </div>

            <div
                class="printDate"
                id="printDate"
            >
                -
            </div>

        </header>


        <!-- =================================================
             4 PRINT BLOCKS
        ================================================== -->

        <div id="printGrid">


            <!-- N + M -->

            <section class="printBlock">

                <div class="blockTitle">
                    N SHOP + M SHOP
                </div>

                <div
                    id="NM"
                    class="shopContainer"
                ></div>

            </section>


            <!-- LIFTING + J -->

            <section class="printBlock">

                <div class="blockTitle">
                    LIFTING BAY + J SHOP
                </div>

                <div
                    id="LJ"
                    class="shopContainer"
                ></div>

            </section>


            <!-- MR SCR -->

            <section class="printBlock">

                <div class="blockTitle">
                    MR SCR SHOP
                </div>

                <div
                    id="SCR"
                    class="shopContainer"
                ></div>

            </section>


            <!-- CR -->

            <section class="printBlock">

                <div class="blockTitle">
                    CR SHOP
                </div>

                <div
                    id="CR"
                    class="shopContainer"
                ></div>

            </section>


        </div>


        <!-- FOOTER -->

        <footer class="printFooter">
            MR CO-ORDINATION &nbsp; | &nbsp; COACH NUMBER POSITION
        </footer>


    </main>


    <!-- =====================================================
         PRINT JS
    ====================================================== -->

    <script
        type="module"
        src="./print.js"
    ></script>


</body>

</html>
