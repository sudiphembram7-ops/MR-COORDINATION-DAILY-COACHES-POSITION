<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>
        MR CO-ORDINATION DAILY COACHES POSITION
    </title>
    <link
        rel="stylesheet"
        href="./print.css"
    >
</head>
<body>
    <!-- ================================================
         SCREEN BUTTON
    ================================================= -->
    <div class="printControls">
        <button id="printButton">
            PRINT A4
        </button>
        <button id="closeButton">
            CLOSE
        </button>
    </div>
    <!-- ================================================
         LOADING
    ================================================= -->
    <div id="loading">
        Loading...
    </div>
    <!-- ================================================
         A4 PAGE
    ================================================= -->
    <main id="printPage">
        <!-- ============================================
             HEADER
        ============================================= -->
        <header class="printHeader">
            <div class="title">
                MR CO-ORDINATION DAILY COACHES POSITION
            </div>
            <div class="workshop">
                LILUAH WORKSHOP
            </div>
            <div
                id="printDate"
                class="printDate"
            >
                -
            </div>
        </header>
        <!-- ============================================
             BOARD
        ============================================= -->
        <div id="boardPrintArea"></div>
        <!-- ============================================
             FOOTER
        ============================================= -->
        <footer class="printFooter">
            MR CO-ORDINATION
            &nbsp; | &nbsp;
            COACH NUMBER POSITION
        </footer>
    </main>
    <!-- ================================================
         JAVASCRIPT
    ================================================= -->
    <script
        type="module"
        src="./print.js"
    ></script>
</body>
</html>
