<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        MR CO-ORDINATION BOARD - PRINT
    </title>

    <link
        rel="stylesheet"
        href="css/print.css"
    >

</head>


<body>

    <div class="print-page">

        <!-- HEADER -->

        <header class="print-header">

            <div class="railway-title">
                INDIAN RAILWAYS
            </div>

            <div class="workshop-title">
                LILUAH WORKSHOP
            </div>

            <div class="board-title">
                MR CO-ORDINATION BOARD
            </div>

            <div class="subtitle">
                DAILY COACHES POSITION
            </div>

        </header>


        <!-- INFORMATION -->

        <section class="print-info">

            <div>
                <strong>Date:</strong>
                <span id="printDate">--</span>
            </div>

            <div>
                <strong>Time:</strong>
                <span id="printTime">--</span>
            </div>

            <div>
                <strong>Total Capacity:</strong>
                <span id="printTotal">145</span>
            </div>

            <div>
                <strong>Occupied:</strong>
                <span id="printOccupied">0</span>
            </div>

            <div>
                <strong>Free:</strong>
                <span id="printFree">145</span>
            </div>

        </section>


        <!-- BOARD -->

        <main id="printBoardContainer">

            <div class="loading">
                Loading board...
            </div>

        </main>


        <!-- FOOTER -->

        <footer class="print-footer">

            <div>
                MR CO-ORDINATION / LILUAH WORKSHOP
            </div>

            <div>
                Generated:
                <span id="generatedTime">--</span>
            </div>

        </footer>

    </div>


    <script type="module">

        import {
            ref,
            get
        } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";


        import {
            database
        } from "./js/firebase-config.js";


        const TOTAL_CAPACITY = 145;


        /* =====================================================
           STATUS
        ===================================================== */

        const STATUS_CLASSES = {

            "PO": "status-po",
            "S": "status-s",
            "LM": "status-lm",
            "MED": "status-med",
            "RL": "status-rl",
            "R1": "status-r1",
            "RS": "status-rs",
            "L": "status-l",
            "HVY": "status-hvy"

        };


        /* =====================================================
           LOAD BOARD
        ===================================================== */

        async function loadPrintBoard() {

            const container =
                document.getElementById(
                    "printBoardContainer"
                );


            try {

                const snapshot =
                    await get(
                        ref(
                            database,
                            "coachBoard"
                        )
                    );


                const boardData =
                    snapshot.exists()
                        ? snapshot.val()
                        : {};


                drawPrintBoard(
                    boardData
                );


                updatePrintCounters(
                    boardData
                );


                updateDateTime();


                /*
                   Give browser a little time
                   to render before printing.
                */

                setTimeout(
                    () => {

                        window.print();

                    },
                    700
                );

            }
            catch (error) {

                console.error(
                    "PRINT LOAD ERROR:",
                    error
                );


                container.innerHTML = `

                    <div class="print-error">

                        Failed to load board.

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                    </div>

                `;

            }

        }


        /* =====================================================
           DRAW PRINT BOARD
        ===================================================== */

        function drawPrintBoard(
            boardData
        ) {

            const container =
                document.getElementById(
                    "printBoardContainer"
                );


            const cells =
                document.querySelectorAll(
                    ".coach-table td"
                );


            /*
               We cannot depend on board.html DOM.
               Therefore create board directly
               from Firebase data.
            */


            const lines =
                Object.keys(
                    boardData || {}
                );


            if (!lines.length) {

                container.innerHTML = `

                    <div class="empty-board">

                        No coach data available.

                    </div>

                `;

                return;

            }


            let html = "";


            html += `

                <table class="print-table">

                    <thead>

                        <tr>

                            <th>SL</th>
                            <th>SHOP</th>
                            <th>LINE</th>
                            <th>POSITION</th>
                            <th>COACH NUMBER</th>
                            <th>COACH TYPE</th>
                            <th>STATUS</th>

                        </tr>

                    </thead>

                    <tbody>

            `;


            let serial = 1;


            lines.forEach(
                line => {

                    const lineData =
                        boardData[line];


                    if (!lineData) {

                        return;

                    }


                    Object.keys(
                        lineData
                    ).forEach(
                        position => {

                            const coach =
                                lineData[
                                    position
                                ];


                            if (!coach) {

                                return;

                            }


                            const coachNo =
                                clean(
                                    coach.coachNo
                                );


                            if (!coachNo) {

                                return;

                            }


                            const coachType =
                                clean(
                                    coach.coachType
                                );


                            const status =
                                clean(
                                    coach.status
                                );


                            const shop =
                                clean(
                                    coach.shop
                                ) ||
                                getShop(
                                    line
                                );


                            const statusClass =
                                STATUS_CLASSES[
                                    status.toUpperCase()
                                ] || "";


                            html += `

                                <tr>

                                    <td>
                                        ${serial++}
                                    </td>

                                    <td>
                                        ${escapeHTML(shop)}
                                    </td>

                                    <td>
                                        ${escapeHTML(line)}
                                    </td>

                                    <td>
                                        ${escapeHTML(position)}
                                    </td>

                                    <td class="coach-number">
                                        ${escapeHTML(coachNo)}
                                    </td>

                                    <td>
                                        ${escapeHTML(coachType)}
                                    </td>

                                    <td class="${statusClass}">
                                        ${escapeHTML(status)}
                                    </td>

                                </tr>

                            `;

                        }
                    );

                }
            );


            html += `

                    </tbody>

                </table>

            `;


            container.innerHTML =
                html;

        }


        /* =====================================================
           COUNTERS
        ===================================================== */

        function updatePrintCounters(
            boardData
        ) {

            let occupied = 0;


            Object.keys(
                boardData || {}
            ).forEach(
                line => {

                    const lineData =
                        boardData[line];


                    if (!lineData) {

                        return;

                    }


                    Object.keys(
                        lineData
                    ).forEach(
                        position => {

                            if (
                                lineData[
                                    position
                                ]
                            ) {

                                occupied++;

                            }

                        }
                    );

                }
            );


            const total =
                TOTAL_CAPACITY;


            const free =
                Math.max(
                    0,
                    total - occupied
                );


            document.getElementById(
                "printTotal"
            ).textContent =
                total;


            document.getElementById(
                "printOccupied"
            ).textContent =
                occupied;


            document.getElementById(
                "printFree"
            ).textContent =
                free;

        }


        /* =====================================================
           DATE TIME
        ===================================================== */

        function updateDateTime() {

            const now =
                new Date();


            const date =
                now.toLocaleDateString(
                    "en-IN",
                    {

                        day: "2-digit",
                        month: "2-digit",
                        year: "numeric"

                    }
                );


            const time =
                now.toLocaleTimeString(
                    "en-IN"
                );


            document.getElementById(
                "printDate"
            ).textContent =
                date;


            document.getElementById(
                "printTime"
            ).textContent =
                time;


            document.getElementById(
                "generatedTime"
            ).textContent =
                date +
                " " +
                time;

        }


        /* =====================================================
           SHOP
        ===================================================== */

        function getShop(
            line
        ) {

            const value =
                clean(
                    line
                ).toUpperCase();


            if (
                value.startsWith("SCR")
            ) {

                return "MR SCR SHOP";

            }


            if (
                value.startsWith("N")
            ) {

                return "N SHOP";

            }


            if (
                value.startsWith("M")
            ) {

                return "M SHOP";

            }


            if (
                value.startsWith("F")
            ) {

                return "CR SHOP";

            }


            if (
                value.startsWith("J")
            ) {

                return "J SHOP";

            }


            if (
                value.startsWith("L")
            ) {

                return "LIFTING BAY";

            }


            return "";

        }


        /* =====================================================
           CLEAN
        ===================================================== */

        function clean(
            value
        ) {

            return String(
                value ?? ""
            ).trim();

        }


        /* =====================================================
           ESCAPE
        ===================================================== */

        function escapeHTML(
            value
        ) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================================
           START
        ===================================================== */

        loadPrintBoard();

    </script>

</body>

</html>
