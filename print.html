<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MR CO-ORDINATION BOARD - A4 PRINT</title>

    <link
        rel="stylesheet"
        href="css/print.css"
    >

</head>


<body>

    <div id="printRoot">

        <div class="print-header">

            <div class="railway-title">
                INDIAN RAILWAYS
            </div>

            <div class="workshop-title">
                LILUAH WORKSHOP
            </div>

            <div class="board-title">
                MR CO-ORDINATION BOARD
            </div>

            <div class="board-subtitle">
                DAILY COACHES POSITION
            </div>

        </div>


        <div class="print-info">

            <span>
                <b>Date:</b>
                <span id="printDate">--</span>
            </span>

            <span>
                <b>Time:</b>
                <span id="printTime">--</span>
            </span>

            <span>
                <b>Total:</b>
                <span id="printTotal">145</span>
            </span>

            <span>
                <b>Occupied:</b>
                <span id="printOccupied">0</span>
            </span>

            <span>
                <b>Free:</b>
                <span id="printFree">145</span>
            </span>

        </div>


        <div id="printBoard">

            <div class="loading">
                Preparing print...
            </div>

        </div>


        <div class="print-footer">

            <span>
                MR CO-ORDINATION / LILUAH WORKSHOP
            </span>

            <span>
                Generated:
                <span id="generatedTime">--</span>
            </span>

        </div>

    </div>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadPrintData();

    }
);


/* =========================================================
   LOAD PRINT DATA
========================================================= */

function loadPrintData() {

    const printBoard =
        document.getElementById(
            "printBoard"
        );


    /*
       board.js will put the complete
       board HTML here.
    */

    const savedHTML =
        sessionStorage.getItem(
            "MR_PRINT_BOARD_HTML"
        );


    const savedCounters =
        sessionStorage.getItem(
            "MR_PRINT_COUNTERS"
        );


    if (!savedHTML) {

        printBoard.innerHTML = `

            <div class="print-error">

                Board data not available.

                <br><br>

                Please open the board and
                click Print again.

            </div>

        `;

        return;

    }


    printBoard.innerHTML =
        savedHTML;


    /*
       Restore counters.
    */

    if (savedCounters) {

        try {

            const counters =
                JSON.parse(
                    savedCounters
                );


            document.getElementById(
                "printTotal"
            ).textContent =
                counters.total ?? 145;


            document.getElementById(
                "printOccupied"
            ).textContent =
                counters.occupied ?? 0;


            document.getElementById(
                "printFree"
            ).textContent =
                counters.free ?? 145;

        }
        catch (error) {

            console.warn(
                "Counter parse error:",
                error
            );

        }

    }


    updateDateTime();


    /*
       Wait for browser layout.
    */

    setTimeout(
        function () {

            window.print();

        },
        800
    );

}


/* =========================================================
   DATE / TIME
========================================================= */

function updateDateTime() {

    const now =
        new Date();


    const date =
        now.toLocaleDateString(
            "en-IN",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        );


    const time =
        now.toLocaleTimeString(
            "en-IN"
        );


    document.getElementById(
        "printDate"
    ).textContent =
        date;


    document.getElementById(
        "printTime"
    ).textContent =
        time;


    document.getElementById(
        "generatedTime"
    ).textContent =
        date +
        " " +
        time;

}


/* =========================================================
   AFTER PRINT
========================================================= */

window.addEventListener(
    "afterprint",
    function () {

        /*
           Do not close automatically.
           User can return to board manually.
        */

    }
);

</script>

</body>

</html>
