<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        MR CO-ORDINATION DAILY COACHES POSITION - PRINT
    </title>

    <style>

        /* =====================================================
           A4 PRINT SETUP
        ===================================================== */

        @page{
            size:A4 landscape;
            margin:5mm;
        }

        *{
            box-sizing:border-box;
        }

        html,
        body{
            margin:0;
            padding:0;
            width:100%;
            background:#fff;
            font-family:Arial,Helvetica,sans-serif;
        }


        /* =====================================================
           PRINT PAGE
        ===================================================== */

        #printPage{
            width:100%;
            max-width:287mm;
            margin:0 auto;
            background:#fff;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .printHeader{
            width:100%;
            text-align:center;
            margin-bottom:2mm;
        }

        .printHeader h1{
            margin:0;
            font-size:13px;
            font-weight:700;
            line-height:1.1;
        }

        .printHeader h2{
            margin:1px 0 0;
            font-size:10px;
            font-weight:600;
        }

        .printHeader .dateTime{
            margin-top:2px;
            font-size:7px;
        }


        /* =====================================================
           SHOP SECTION
        ===================================================== */

        .shopSection{
            width:100%;
            margin-bottom:2mm;
            page-break-inside:avoid;
        }

        .shopTitle{
            width:100%;
            text-align:center;
            font-size:9px;
            font-weight:700;
            padding:1.5mm 0;
            background:#ffc107;
            border:0.3mm solid #222;
        }


        /* =====================================================
           BOARD TABLE
        ===================================================== */

        .boardTable{
            width:100%;
            border-collapse:collapse;
            table-layout:fixed;
        }

        .boardTable th,
        .boardTable td{
            border:0.25mm solid #555;
            text-align:center;
            vertical-align:middle;
            padding:0;
            height:9mm;
            overflow:hidden;
        }

        .boardTable th{
            background:#20282c;
            color:#fff;
            font-size:6px;
            font-weight:700;
            height:6mm;
        }

        .positionHeader{
            width:12mm;
        }

        .positionCell{
            width:12mm;
            background:#20282c;
            color:#fff;
            font-size:6px;
            font-weight:700;
        }

        .coachCell{
            background:#fff;
            color:#000;
            font-size:8px;
            font-weight:700;
            white-space:nowrap;
        }

        .emptyCell{
            background:#fff;
        }


        /* =====================================================
           ONLY COACH NUMBER
        ===================================================== */

        .coachNumber{
            display:block;
            width:100%;
            text-align:center;
            font-size:8px;
            font-weight:700;
            line-height:1;
            white-space:nowrap;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .printFooter{
            width:100%;
            text-align:center;
            margin-top:2mm;
            font-size:6px;
        }


        /* =====================================================
           SCREEN CONTROLS
        ===================================================== */

        .screenControls{
            position:fixed;
            top:10px;
            right:10px;
            z-index:9999;
            display:flex;
            gap:6px;
        }

        .screenControls button{
            border:0;
            padding:8px 14px;
            border-radius:5px;
            background:#198754;
            color:#fff;
            font-size:13px;
            font-weight:700;
            cursor:pointer;
        }

        .screenControls button:last-child{
            background:#dc3545;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        #loading{
            position:fixed;
            inset:0;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#fff;
            z-index:9998;
            font-size:18px;
            font-weight:700;
        }


        /* =====================================================
           PRINT MODE
        ===================================================== */

        @media print{

            .screenControls,
            #loading{
                display:none !important;
            }

            body{
                width:100%;
                background:#fff;
            }

            #printPage{
                width:100%;
                max-width:none;
                margin:0;
            }

            .shopSection{
                page-break-inside:avoid;
                break-inside:avoid;
            }

            .printHeader{
                page-break-after:avoid;
            }

        }


        /* =====================================================
           SMALL SCREEN PREVIEW
        ===================================================== */

        @media screen and (max-width:900px){

            #printPage{
                width:1100px;
                margin:70px auto 20px;
            }

            body{
                overflow-x:auto;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         SCREEN BUTTONS
    ====================================================== -->

    <div class="screenControls">

        <button onclick="window.print()">
            PRINT A4
        </button>

        <button onclick="window.close()">
            CLOSE
        </button>

    </div>


    <!-- =====================================================
         LOADING
    ====================================================== -->

    <div id="loading">
        Loading Coach Board...
    </div>


    <!-- =====================================================
         PRINT PAGE
    ====================================================== -->

    <main id="printPage">

        <div class="printHeader">

            <h1>
                MR CO-ORDINATION DAILY COACHES POSITION
            </h1>

            <h2>
                LILUAH WORKSHOP
            </h2>

            <div class="dateTime" id="printDate">
                Loading...
            </div>

        </div>


        <!-- Firebase data will be inserted here -->

        <div id="boardPrintArea"></div>


        <div class="printFooter">

            MR CO-ORDINATION
            &nbsp; | &nbsp;
            Coach Number Position

        </div>

    </main>


    <!-- =====================================================
         FIREBASE + PRINT SCRIPT
    ====================================================== -->

    <script type="module">

        import {
            ref,
            get
        } from
        "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";


        import {
            database
        } from "./firebase-config.js";


        /* =====================================================
           CONFIGURATION
        ===================================================== */

        const BOARD_PATH = "coachBoard";


        /* =====================================================
           SHOP ORDER
        ===================================================== */

        const SHOP_ORDER = [

            "N SHOP",
            "M SHOP",
            "LIFTING BAY",
            "MR SCR SHOP",
            "CR SHOP",
            "J SHOP"

        ];


        /* =====================================================
           COMMON SHOP NAME CONVERTER
        ===================================================== */

        function normaliseShop(shop){

            if(!shop){
                return "";
            }

            const value =
                String(shop)
                .trim()
                .toUpperCase();

            if(
                value === "N" ||
                value === "N SHOP"
            ){
                return "N SHOP";
            }

            if(
                value === "M" ||
                value === "M SHOP"
            ){
                return "M SHOP";
            }

            if(
                value === "LIFTING" ||
                value === "LIFTING BAY"
            ){
                return "LIFTING BAY";
            }

            if(
                value === "SCR" ||
                value === "MR SCR" ||
                value === "MR SCR SHOP"
            ){
                return "MR SCR SHOP";
            }

            if(
                value === "CR" ||
                value === "CR SHOP"
            ){
                return "CR SHOP";
            }

            if(
                value === "J" ||
                value === "J SHOP"
            ){
                return "J SHOP";
            }

            return value;

        }


        /* =====================================================
           COACH NUMBER
        ===================================================== */

        function getCoachNumber(coach){

            if(
                coach === null ||
                coach === undefined
            ){
                return "";
            }


            if(
                typeof coach === "string" ||
                typeof coach === "number"
            ){
                return String(coach).trim();
            }


            if(typeof coach === "object"){

                return String(

                    coach.coachNo ??
                    coach.coachNumber ??
                    coach.number ??
                    coach.coach ??
                    ""

                ).trim();

            }


            return "";

        }


        /* =====================================================
           ADD COACH
        ===================================================== */

        function addCoach(
            data,
            shop,
            line,
            position,
            coach
        ){

            const coachNo =
                getCoachNumber(coach);


            if(!coachNo){
                return;
            }


            shop =
                normaliseShop(shop);


            if(!shop){
                return;
            }


            if(!data[shop]){
                data[shop] = {};
            }


            if(!data[shop][line]){
                data[shop][line] = {};
            }


            data[shop][line][position] =
                coachNo;

        }


        /* =====================================================
           PARSE FIREBASE DATA
        ===================================================== */

        function parseBoard(raw){

            const result = {};


            if(
                !raw ||
                typeof raw !== "object"
            ){
                return result;
            }


            /*
             * FORMAT 1
             *
             * shop
             *   line
             *      position
             */

            for(
                const shopKey of Object.keys(raw)
            ){

                const shopValue =
                    raw[shopKey];


                if(
                    !shopValue ||
                    typeof shopValue !== "object"
                ){
                    continue;
                }


                const shop =
                    normaliseShop(shopKey);


                /*
                 * Direct nested format
                 */

                for(
                    const lineKey of Object.keys(shopValue)
                ){

                    const lineValue =
                        shopValue[lineKey];


                    if(
                        !lineValue ||
                        typeof lineValue !== "object"
                    ){
                        continue;
                    }


                    /*
                     * line -> position -> coach
                     */

                    for(
                        const positionKey of
                        Object.keys(lineValue)
                    ){

                        const coach =
                            lineValue[positionKey];


                        const coachNo =
                            getCoachNumber(coach);


                        if(coachNo){

                            addCoach(
                                result,
                                shop,
                                lineKey,
                                positionKey,
                                coach
                            );

                        }

                    }

                }

            }


            /*
             * FORMAT 2
             *
             * flat Firebase records
             */

            for(
                const key of Object.keys(raw)
            ){

                const item =
                    raw[key];


                if(
                    !item ||
                    typeof item !== "object"
                ){
                    continue;
                }


                const coachNo =
                    getCoachNumber(item);


                if(!coachNo){
                    continue;
                }


                const shop =
                    normaliseShop(
                        item.shop
                    );


                const line =
                    String(
                        item.line ??
                        ""
                    ).trim();


                const position =
                    String(
                        item.position ??
                        ""
                    ).trim();


                if(
                    shop &&
                    line &&
                    position
                ){

                    addCoach(
                        result,
                        shop,
                        line,
                        position,
                        item
                    );

                }

            }


            /*
             * FORMAT 3
             *
             * Firebase records where key itself
             * contains Cell ID.
             *
             * Example:
             * N2_H1
             * SCR9_H1
             * F1_H
             */

            for(
                const key of Object.keys(raw)
            ){

                const item =
                    raw[key];


                if(
                    !item ||
                    typeof item !== "object"
                ){
                    continue;
                }


                const coachNo =
                    getCoachNumber(item);


                if(!coachNo){
                    continue;
                }


                const id =
                    String(
                        item.id ??
                        item.cellId ??
                        item.cell ??
                        key
                    )
                    .trim()
                    .toUpperCase();


                let shop = "";
                let line = "";
                let position = "";


                if(
                    id.startsWith("SCR")
                ){

                    shop =
                        "MR SCR SHOP";

                    const match =
                        id.match(
                            /^(SCR\d+)[_-](H1|H2|D2|D1)$/
                        );

                    if(match){

                        line =
                            match[1];

                        position =
                            match[2];

                    }

                }
                else if(
                    id.startsWith("N")
                ){

                    shop =
                        "N SHOP";

                    const match =
                        id.match(
                            /^(N\d+)[_-](H1|H2|H3|D3|D2|D1)$/
                        );

                    if(match){

                        line =
                            match[1];

                        position =
                            match[2];

                    }

                }
                else if(
                    id.startsWith("M")
                ){

                    shop =
                        "M SHOP";

                    const match =
                        id.match(
                            /^(M\d+)[_-](H|C|D)$/
                        );

                    if(match){

                        line =
                            match[1];

                        position =
                            match[2];

                    }

                }
                else if(
                    id.startsWith("L")
                ){

                    shop =
                        "LIFTING BAY";

                    const match =
                        id.match(
                            /^(L\d+)[_-](H|C|D)$/
                        );

                    if(match){

                        line =
                            match[1];

                        position =
                            match[2];

                    }

                }
                else if(
                    id.startsWith("F")
                ){

                    shop =
                        "CR SHOP";

                    const match =
                        id.match(
                            /^(F\d+)[_-](H|D)$/
                        );

                    if(match){

                        line =
                            match[1];

                        position =
                            match[2];

                    }

                }
                else if(
                    id.startsWith("J")
                ){

                    shop =
                        "J SHOP";

                    const match =
                        id.match(
                            /^(J\d+)[_-](H1|H2|D2|D1)$/
                        );

                    if(match){

                        line =
                            match[1];

                        position =
                            match[2];

                    }

                }


                if(
                    shop &&
                    line &&
                    position
                ){

                    addCoach(
                        result,
                        shop,
                        line,
                        position,
                        item
                    );

                }

            }


            return result;

        }


        /* =====================================================
           SORT NATURAL
        ===================================================== */

        function naturalSort(a,b){

            return String(a).localeCompare(
                String(b),
                undefined,
                {
                    numeric:true,
                    sensitivity:"base"
                }
            );

        }


        /* =====================================================
           DRAW SHOP
        ===================================================== */

        function drawShop(
            shop,
            lines
        ){

            const section =
                document.createElement("section");

            section.className =
                "shopSection";


            const title =
                document.createElement("div");

            title.className =
                "shopTitle";

            title.textContent =
                shop;


            section.appendChild(title);


            const table =
                document.createElement("table");

            table.className =
                "boardTable";


            const allLines =
                Object.keys(lines)
                .sort(naturalSort);


            const positionsSet =
                new Set();


            allLines.forEach(
                line => {

                    Object.keys(
                        lines[line] || {}
                    ).forEach(
                        position =>
                            positionsSet.add(
                                position
                            )
                    );

                }
            );


            const positions =
                Array.from(
                    positionsSet
                );


            positions.sort(
                naturalSort
            );


            /* =================================================
               HEADER
            ================================================= */

            const thead =
                document.createElement("thead");


            const headerRow =
                document.createElement("tr");


            const positionHeader =
                document.createElement("th");

            positionHeader.className =
                "positionHeader";

            positionHeader.textContent =
                "Position";


            headerRow.appendChild(
                positionHeader
            );


            allLines.forEach(
                line => {

                    const th =
                        document.createElement("th");

                    th.textContent =
                        line;

                    headerRow.appendChild(
                        th
                    );

                }
            );


            thead.appendChild(
                headerRow
            );


            table.appendChild(
                thead
            );


            /* =================================================
               BODY
            ================================================= */

            const tbody =
                document.createElement("tbody");


            positions.forEach(
                position => {

                    const row =
                        document.createElement("tr");


                    const positionCell =
                        document.createElement("td");

                    positionCell.className =
                        "positionCell";

                    positionCell.textContent =
                        position;


                    row.appendChild(
                        positionCell
                    );


                    allLines.forEach(
                        line => {

                            const td =
                                document.createElement("td");

                            td.className =
                                "coachCell";


                            const coachNo =
                                lines[line]?.[position] ||
                                "";


                            if(coachNo){

                                const span =
                                    document.createElement("span");

                                span.className =
                                    "coachNumber";

                                span.textContent =
                                    coachNo;

                                td.appendChild(
                                    span
                                );

                            }
                            else{

                                td.classList.add(
                                    "emptyCell"
                                );

                            }


                            row.appendChild(
                                td
                            );

                        }
                    );


                    tbody.appendChild(
                        row
                    );

                }
            );


            table.appendChild(
                tbody
            );


            section.appendChild(
                table
            );


            return section;

        }


        /* =====================================================
           LOAD BOARD
        ===================================================== */

        async function loadBoard(){

            try{

                const snapshot =
                    await get(
                        ref(
                            database,
                            BOARD_PATH
                        )
                    );


                if(!snapshot.exists()){

                    document.getElementById(
                        "boardPrintArea"
                    ).innerHTML =
                        "<p style='text-align:center;'>No coach data found.</p>";

                    return;

                }


                const raw =
                    snapshot.val();


                const board =
                    parseBoard(raw);


                const area =
                    document.getElementById(
                        "boardPrintArea"
                    );


                area.innerHTML = "";


                let count = 0;


                /*
                 * First print shops in fixed order
                 */

                SHOP_ORDER.forEach(
                    shop => {

                        if(
                            board[shop] &&
                            Object.keys(
                                board[shop]
                            ).length
                        ){

                            area.appendChild(
                                drawShop(
                                    shop,
                                    board[shop]
                                )
                            );

                            count++;

                        }

                    }
                );


                /*
                 * Print any additional shop
                 */

                Object.keys(board)
                    .forEach(
                        shop => {

                            if(
                                !SHOP_ORDER.includes(
                                    shop
                                )
                            ){

                                area.appendChild(
                                    drawShop(
                                        shop,
                                        board[shop]
                                    )
                                );

                                count++;

                            }

                        }
                    );


                if(!count){

                    area.innerHTML =
                        "<p style='text-align:center;'>No coach data found.</p>";

                }


            }
            catch(error){

                console.error(
                    "PRINT ERROR:",
                    error
                );


                document.getElementById(
                    "boardPrintArea"
                ).innerHTML =

                    "<p style='text-align:center;color:red;'>" +
                    "Unable to load Coach Board." +
                    "</p>";

            }
            finally{

                document.getElementById(
                    "loading"
                ).style.display =
                    "none";

            }

        }


        /* =====================================================
           DATE
        ===================================================== */

        function setPrintDate(){

            const now =
                new Date();


            const date =
                now.toLocaleDateString(
                    "en-IN",
                    {
                        day:"2-digit",
                        month:"2-digit",
                        year:"numeric"
                    }
                );


            const time =
                now.toLocaleTimeString(
                    "en-IN",
                    {
                        hour:"2-digit",
                        minute:"2-digit",
                        second:"2-digit"
                    }
                );


            document.getElementById(
                "printDate"
            ).textContent =
                "Printed: " +
                date +
                "  " +
                time;

        }


        /* =====================================================
           START
        ===================================================== */

        setPrintDate();

        loadBoard();

    </script>


</body>

</html>
