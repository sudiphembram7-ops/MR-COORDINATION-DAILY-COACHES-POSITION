
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MR CO-ORDINATION - PRINT</title>


<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #fff;
    color: #000;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    padding: 10px;
}

.print-container {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
}

.print-header {
    text-align: center;
    margin-bottom: 8px;
}

.print-header h1 {
    margin: 0;
    font-size: 20px;
    line-height: 1.1;
    font-weight: 700;
}

.print-header h2 {
    margin: 3px 0 0;
    font-size: 13px;
}

.print-date {
    margin-top: 3px;
    font-size: 9px;
}

.print-controls {
    text-align: center;
    margin-bottom: 10px;
}

.print-btn, .refresh-btn {
    border: 0;
    color: #fff;
    padding: 7px 18px;
    border-radius: 5px;
    font-size: 12px;
    cursor: pointer;
}

.print-btn {
    background: #0d6efd;
}

.refresh-btn {
    background: #198754;
    margin-left: 5px;
}

#printArea {
    width: 100%;
    margin: 0 auto;
}

/* TWO SHOP GROUPS SIDE BY SIDE */
.print-row {
    display: grid;
    grid-template-columns: max-content max-content;
    justify-content: start;
    align-items: start;
    gap: 10px;
    margin-bottom: 8px;
}

/* SHOP GROUP */
.group {
    width: max-content;
    margin: 0;
    break-inside: avoid;
    page-break-inside: avoid;
}

.group-title {
    background: #000;
    color: #fff;
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 4px;
    line-height: 1;
    border: 1px solid #000;
    width: 100%;
}

/* ALL TABLES */
table {
    width: max-content !important;
    table-layout: fixed !important;
    border-collapse: collapse !important;
    margin: 0;
}

/* EVERY COLUMN SAME WIDTH */
th, td {
    width: 70px !important;
    min-width: 70px !important;
    max-width: 70px !important;
    box-sizing: border-box;
    text-align: center;
    vertical-align: middle;
    border: 1px solid #000;
    padding: 2px;
    overflow: hidden;
}

/* TABLE HEADING */
th {
    height: 18px;
    background: #e8e8e8;
    font-size: 8px;
    font-weight: 700;
}

/* COACH NUMBER */
.print-coach-number {
    display: block;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.15;
    white-space: nowrap;
}

/* TYPE AND STATUS SIDE BY SIDE */
.print-coach-meta {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 3px;
    flex-wrap: nowrap;
    white-space: nowrap;
    line-height: 1.1;
}

.print-coach-type,
.print-coach-status {
    display: inline-block;
    font-size: 8px;
    font-weight: 600;
    line-height: 1.1;
    white-space: nowrap;
    margin: 0;
    padding: 0;
}

/* FULL WIDTH SHOPS */
.full-width {
    width: 100%;
    margin-bottom: 8px;
}

.full-width table {
    width: max-content !important;
}

/* LOADING AND ERROR */
#loading {
    text-align: center;
    padding: 12px;
    font-size: 12px;
    font-weight: bold;
}

#error {
    text-align: center;
    color: red;
    padding: 8px;
    font-size: 12px;
    font-weight: bold;
}

/* MOBILE */
@media screen and (max-width: 768px) {
    .print-container {
        max-width: 100%;
    }

    #printArea {
        overflow-x: auto;
    }

    .print-header h1 {
        font-size: 16px;
    }

    .print-row {
        gap: 5px;
    }
}

/* A4 LANDSCAPE PRINT */
@page {
    size: A4 landscape;
    margin: 8mm;
}

@media print {
    html, body {
        margin: 0;
        padding: 0;
        background: #fff;
    }

    body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .print-container {
        width: 100%;
        max-width: none;
        margin: 0;
        padding: 0;
    }

    #printArea {
        width: 100%;
        max-width: none;
        margin: 0;
        overflow: visible;
    }

    .print-header {
        margin-bottom: 4px;
    }

    .print-header h1 {
        font-size: 13px;
    }

    .print-header h2 {
        font-size: 9px;
    }

    .print-date {
        font-size: 6px;
    }

    .print-controls,
    #loading,
    #error {
        display: none !important;
    }

    .print-row {
        grid-template-columns: max-content max-content;
        gap: 8px;
        margin-bottom: 3mm;
    }

    .group-title {
        font-size: 7px;
        padding: 1.5mm 1mm;
    }

    th, td {
        width: 70px !important;
        min-width: 70px !important;
        max-width: 70px !important;
        border: 0.3mm solid #000;
        padding: 0.7mm 0.5mm;
    }

    th {
        height: 6mm;
        font-size: 5.5px;
    }

    td {
        height: auto;
        font-size: 6px;
    }

    .print-coach-number {
        font-size: 14px;
    }

    .print-coach-type,
    .print-coach-status {
        font-size: 8px;
    }

    .full-width {
        margin-bottom: 3mm;
    }
}

/* ===== FULL PAGE WIDTH FIX ===== */

.print-container {
    width: 100% !important;
    max-width: none !important;
}

#printArea {
    width: 100% !important;
    max-width: none !important;
    margin: 0 auto !important;
}

/* N + J AND LIFTING + M */
.print-row {
    display: grid !important;
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    width: 100% !important;
    gap: 5mm !important;
    margin-bottom: 4mm !important;
}

.group {
    width: 100% !important;
    min-width: 0 !important;
}

/* ALL TABLES FULL WIDTH */
.group table,
.full-width table {
    width: 100% !important;
    max-width: 100% !important;
    table-layout: fixed !important;
    border-collapse: collapse !important;
}

/* EQUAL COLUMNS INSIDE EACH TABLE */
.group table th,
.group table td {
    width: auto !important;
    min-width: 0 !important;
    max-width: none !important;
    text-align: center !important;
    vertical-align: middle !important;
    overflow: hidden !important;
    overflow-wrap: anywhere !important;
}

/* REMOVE OLD POSITION COLUMN STYLING */
#printArea table th:first-child,
#printArea table td:first-child {
    width: auto !important;
    min-width: 0 !important;
}

/* TYPE AND STATUS SIDE BY SIDE */
.print-coach-meta {
    display: flex !important;
    flex-direction: row !important;
    justify-content: center !important;
    align-items: center !important;
    flex-wrap: nowrap !important;
    gap: 3px !important;
}

/* FULL WIDTH SCR AND CR */
.full-width {
    width: 100% !important;
    margin-bottom: 4mm !important;
}

/* PRINT PAGE */
@media print {
    .print-container,
    #printArea {
        width: 100% !important;
        max-width: none !important;
    }

    .print-row {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        width: 100% !important;
        gap: 5mm !important;
    }

    .group table,
    .full-width table {
        width: 100% !important;
        table-layout: fixed !important;
    }

    .group table th,
    .group table td {
        width: auto !important;
        min-width: 0 !important;
        max-width: none !important;
    }
}

/* REMOVE BLACK SHOP HEADING */
.group-title {
    background: #fff !important;
    color: #000 !important;
    border: none !important;
    font-weight: 700 !important;
}

/* REMOVE ALL TABLE LINES */
#printArea table,
#printArea th,
#printArea td {
    border: none !important;
    outline: none !important;
}

/* WHITE TABLE BACKGROUND */
#printArea table,
#printArea th,
#printArea td {
    background: #fff !important;
    color: #000 !important;
}

/* REMOVE HEADING CELL COLOUR */
#printArea th {
    background: #fff !important;
    font-weight: 700 !important;
}

/* KEEP COACH DETAILS CLEAR */
.print-coach-number {
    color: #000 !important;
}

.print-coach-type,
.print-coach-status {
    color: #000 !important;
}

/* PRINT WITHOUT BLACK BACKGROUND */
@media print {
    .group-title,
    #printArea th,
    #printArea td {
        background: #fff !important;
        color: #000 !important;
        border: none !important;
    }
}

/* ===== FIT EVERYTHING ON ONE A4 PAGE ===== */

@page {
    size: A4 landscape;
    margin: 5mm;
}

@media print {

    html, body {
        width: 287mm !important;
        height: 200mm !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
    }

    .print-container {
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    #printArea {
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
    }

    /* HEADER */
    .print-header {
        margin-bottom: 2mm !important;
    }

    .print-header h1 {
        font-size: 11px !important;
    }

    .print-header h2 {
        font-size: 8px !important;
    }

    .print-date {
        font-size: 6px !important;
    }

    /* TWO SHOP ROWS */
    .print-row {
        display: grid !important;
        grid-template-columns: 1fr 1fr !important;
        gap: 3mm !important;
        margin-bottom: 2mm !important;
    }

    .group {
        width: 100% !important;
        margin: 0 !important;
        break-inside: avoid !important;
    }

    /* SHOP TITLES */
    .group-title {
        background: white !important;
        color: black !important;
        border: none !important;
        font-size: 7px !important;
        padding: 1mm !important;
    }

    /* TABLES */
    .group table,
    .full-width table {
        width: 100% !important;
        table-layout: fixed !important;
        border-collapse: collapse !important;
    }

    th, td {
        width: auto !important;
        min-width: 0 !important;
        max-width: none !important;
        height: auto !important;
        padding: 0.5mm !important;
        border: none !important;
        background: white !important;
        color: black !important;
        line-height: 1 !important;
    }

    th {
        font-size: 5px !important;
    }

    .print-coach-number {
        font-size: 9px !important;
        line-height: 1.1 !important;
    }

    .print-coach-meta {
        display: flex !important;
        flex-direction: row !important;
        justify-content: center !important;
        gap: 2px !important;
        white-space: nowrap !important;
    }

    .print-coach-type,
    .print-coach-status {
        font-size: 6px !important;
        line-height: 1 !important;
    }

    .full-width {
        width: 100% !important;
        margin-bottom: 2mm !important;
        break-inside: avoid !important;
    }

    .print-controls,
    #loading,
    #error {
        display: none !important;
    }
}


/* BLACK TABLE GRID LINES */
#printArea table {
    border-collapse: collapse !important;
    border: 1px solid #000 !important;
}

#printArea th,
#printArea td {
    border: 1px solid #000 !important;
    background: #fff !important;
    color: #000 !important;
}

/* SHOP TITLE WITHOUT BLACK BACKGROUND */
.group-title {
    background: #fff !important;
    color: #000 !important;
    border: none !important;
}

/* PRINT BORDER */
@media print {
    #printArea table,
    #printArea th,
    #printArea td {
        border: 1px solid #000 !important;
    }
}


</style>

</head>

<body>

<div class="print-container">

    <div class="print-header">
        <h1>MR CO-ORDINATION DAILY COACHES POSITION</h1>
        <h2>LILUAH WORKSHOP</h2>
        <div id="printDate" class="print-date">--</div>
    </div>

    <div class="print-controls">
        <button class="print-btn" onclick="window.print()">PRINT</button>
        <button class="refresh-btn" onclick="location.reload()">REFRESH</button>
    </div>

    <div id="loading">Loading coach board...</div>
    <div id="error"></div>

    <div id="printArea">

        <!-- FIRST ROW: N SHOP + J SHOP -->
        <div class="print-row">

            <section class="group">
                <div class="group-title">N SHOP</div>
                <table>
                    <thead>
                        <tr>
                            <th>N2</th>
                            <th>N3</th>
                            <th>N5</th>
                            <th>N7</th>
                            <th>N8</th>
                        </tr>
                    </thead>
                    <tbody id="nTable"></tbody>
                </table>
            </section>

            <section class="group">
                <div class="group-title">J SHOP</div>
                <table>
                    <thead>
                        <tr>
                           
                            <th>J1</th>
                            <th>J2</th>
                            <th>J3</th>
                            <th>J4</th>
                            <th>J5</th>
                            <th>J6</th>
                        </tr>
                    </thead>
                    <tbody id="jTable"></tbody>
                </table>
            </section>

        </div>

        <!-- SECOND ROW: LIFTING BAY + M SHOP -->
        <div class="print-row">

            <section class="group">
                <div class="group-title">LIFTING BAY</div>
                <table>
                    <thead>
                        <tr>
                           
                            <th>L9</th>
                            <th>L10</th>
                        </tr>
                    </thead>
                    <tbody id="lTable"></tbody>
                </table>
            </section>

            <section class="group">
                <div class="group-title">M SHOP</div>
                <table>
                    <thead>
                        <tr>
                            
                            <th>M2</th>
                            <th>M3</th>
                            <th>M4</th>
                            <th>M5</th>
                            <th>M6</th>
                        </tr>
                    </thead>
                    <tbody id="mTable"></tbody>
                </table>
            </section>

        </div>

        <!-- FULL WIDTH: MR SCR SHOP -->
        <section class="group full-width">
            <div class="group-title">MR SCR SHOP</div>
            <table>
                <thead>
                    <tr>
                        <th>SCR9</th>
                        <th>SCR10</th>
                        <th>SCR11</th>
                        <th>SCR12</th>
                        <th>SCR13</th>
                        <th>SCR14</th>
                        <th>SCR15</th>
                        <th>SCR16</th>
                        <th>SCR18</th>
                        <th>SCR19</th>
                        <th>SCR21</th>
                        <th>SCR22</th>
                    </tr>
                </thead>
                <tbody id="scrTable"></tbody>
            </table>
        </section>

        <!-- FULL WIDTH: CR SHOP -->
        <section class="group full-width">
            <div class="group-title">CR SHOP</div>
            <table>
                <thead>
                    <tr>
                       
                        <th>F1</th>
                        <th>F2</th>
                        <th>F3</th>
                        <th>F4</th>
                        <th>F5</th>
                        <th>F6</th>
                        <th>F7</th>
                        <th>F8</th>
                        <th>F9</th>
                        <th>F10</th>
                        <th>F11</th>
                    </tr>
                </thead>
                <tbody id="crTable"></tbody>
            </table>
        </section>

    </div>
</div>

<script type="module" src="js/print.js?v=143"></script>

</body>
</html>
