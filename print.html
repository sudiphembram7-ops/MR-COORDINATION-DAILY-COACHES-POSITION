<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR CO-ORDINATION PRINT</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/print.css">
</head>

<body onload="window.print()">

<header class="header bg-primary text-white text-center p-2">

    <h3>MR CO-ORDINATION DAILY COACHES POSITION</h3>

    <h5>LILUAH WORKSHOP</h5>

    <div class="d-flex justify-content-center gap-4">

        <span id="liveDate"></span>

        <span id="liveTime"></span>

        <span id="lastUpdate"></span>

    </div>

</header>

<div class="container-fluid print-board">

    <!-- First Row -->
    <div class="row">

        <!-- N SHOP -->
        <div class="col-6">

            <div class="shop-card">

                <h4 class="shop-title bg-warning text-center p-2">
                    N SHOP
                </h4>

                <!-- এখানে আপনার index.html-এর সম্পূর্ণ N SHOP Table
                     হুবহু Copy করবেন -->
            </div>

        </div>

        <!-- M SHOP -->
        <div class="col-6">

            <div class="shop-card">

                <h4 class="shop-title bg-warning text-center p-2">
                    M SHOP
                </h4>

                <!-- এখানে আপনার index.html-এর সম্পূর্ণ M SHOP Table
                     হুবহু Copy করবেন -->

            </div>

        </div>

    </div>
    
        <!-- ======================================
         SECOND ROW
    ======================================= -->

    <div class="row mt-3">

        <!-- LIFTING BAY -->
        <div class="col-4">

            <div class="shop-card">

                <h4 class="shop-title bg-warning text-center p-2">
                    LIFTING BAY
                </h4>

                <!-- এখানে index.html-এর সম্পূর্ণ
                     LIFTING BAY Table Copy করুন -->

            </div>

        </div>

        <!-- J SHOP -->
        <div class="col-8">

            <div class="shop-card">

                <h4 class="shop-title bg-success text-white text-center p-2">
                    J SHOP
                </h4>

                <!-- এখানে index.html-এর সম্পূর্ণ
                     J SHOP Table Copy করুন -->

            </div>

        </div>

    </div>

    <!-- ======================================
         THIRD ROW START
    ======================================= -->
    
        <!-- ======================================
         THIRD ROW
         MR SCR SHOP
    ======================================= -->

    <div class="row mt-3">

        <div class="col-12">

            <div class="shop-card">

                <h4 class="shop-title bg-warning text-center p-2">
                    MR SCR SHOP
                </h4>

                <!-- এখানে index.html-এর সম্পূর্ণ
                     MR SCR SHOP Table
                     (SCR9 থেকে SCR22 পর্যন্ত)
                     হুবহু Copy করুন -->

            </div>

        </div>

    </div>

    <!-- ======================================
         FOURTH ROW
         CR SHOP
    ======================================= -->
    
        <div class="row mt-3">

        <!-- CR SHOP -->
        <div class="col-12">

            <div class="shop-card">

                <h4 class="shop-title bg-info text-white text-center p-2">
                    CR SHOP
                </h4>

                <!-- এখানে index.html-এর সম্পূর্ণ
                     CR SHOP Table
                     হুবহু Copy করুন -->

            </div>

        </div>

    </div>

    <!-- ======================================
         STATUS LEGEND
    ======================================= -->

    <div class="card mt-3">

        <div class="card-header bg-dark text-white">
            Railway Status Legend
        </div>

        <div class="card-body text-center">

            <span class="badge bg-success">PO</span>
            <span class="badge bg-warning text-dark">LM</span>
            <span class="badge bg-danger">MED</span>
            <span class="badge bg-primary">RL</span>
            <span class="badge bg-info text-dark">WIP</span>
            <span class="badge bg-secondary">HOLD</span>

        </div>

    </div>

</div>

<script type="module" src="js/print.js"></script>

<script>
window.addEventListener("load", () => {
    setTimeout(() => {
        window.print();
    }, 800);
});
</script>

</body>
</html>
