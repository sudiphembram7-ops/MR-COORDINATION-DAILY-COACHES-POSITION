
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MR CO-ORDINATION - PRINT</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #fff;
    color: #000;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    padding: 8px;
}

.print-container {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
}

.print-header {
    text-align: center;
    margin-bottom: 8px;
}

.print-header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.1;
}

.print-header h2 {
    margin: 2px 0;
    font-size: 12px;
}

.print-date {
    font-size: 9px;
    margin-top: 2px;
}

.print-controls {
    text-align: center;
    margin-bottom: 10px;
}

.print-btn, .refresh-btn {
    border: 0;
    color: white;
    padding: 7px 18px;
    border-radius: 5px;
    font-size: 12px;
    cursor: pointer;
}

.print-btn {
    background: #0d6efd;
}

.refresh-btn {
    background: #198754;
    margin-left: 5px;
}

#printArea {
    width: 100%;
    max-width: 100%;
    margin: 0 auto;
}

/* TWO SHOP SIDE BY SIDE */
.print-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 5px;
    margin-bottom: 6px;
    width: 100%;
}

/* SHOP SECTION */
.group {
    width: 100%;
    min-width: 0;
    margin: 0 0 6px;
    break-inside: avoid;
    page-break-inside: avoid;
}

/* SHOP TITLE - WHITE BACKGROUND */
.group-title {
    background: white;
    color: black;
    text-align: center;
    font-size: 10px;
    font-weight: bold;
    padding: 4px;
    border: 1px solid black;
}

/* ALL TABLES */
table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
    margin: 0;
}

/* BLACK CELL BORDER */
th, td {
    border: 1px solid black;
    width: auto;
    padding: 3px 1px;
    text-align: center;
    vertical-align: middle;
    overflow: hidden;
}

/* LINE HEADER - WHITE */
th {
    background: white;
    color: black;
    font-size: 9px;
    font-weight: bold;
    height: 22px;
}

/* COACH CELL HEIGHT */
td {
    height: 32px;
    background: white;
    color: black;
}

/* COACH NUMBER */
.print-coach-number {
    display: block;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.15;
    white-space: nowrap;
}

/* TYPE AND STATUS SIDE BY SIDE */
.print-coach-meta {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 3px;
    flex-wrap: nowrap;
    white-space: nowrap;
    line-height: 1.1;
    margin-top: 2px;
}

.print-coach-type,
.print-coach-status {
    display: inline-block;
    font-size: 8px;
    font-weight: 600;
    white-space: nowrap;
}

/* LOADING AND ERROR */
#loading {
    text-align: center;
    padding: 12px;
    font-size: 12px;
    font-weight: bold;
}

#error {
    text-align: center;
    color: red;
    padding: 8px;
    font-size: 12px;
    font-weight: bold;
}

/* MOBILE VIEW */
@media screen and (max-width: 600px) {
    body {
        padding: 4px;
    }

    .print-row {
        gap: 3px;
    }

    th {
        font-size: 7px;
    }

    td {
        height: 27px;
        padding: 2px 0;
    }

    .print-coach-number {
        font-size: 9px;
    }

    .print-coach-type,
    .print-coach-status {
        font-size: 6px;
    }

    .print-coach-meta {
        gap: 1px;
    }
}

/* A4 LANDSCAPE - ONE PAGE */
@page {
    size: A4 landscape;
    margin: 5mm;
}

@media print {
    html, body {
        width: 100%;
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
        overflow: visible !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .print-container {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 auto !important;
        padding: 0 !important;
    }

    #printArea {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 auto !important;
        zoom: 0.85;
    }

    .print-header {
        margin-bottom: 3mm;
    }

    .print-header h1 {
        font-size: 13px;
    }

    .print-header h2 {
        font-size: 9px;
    }

    .print-date {
        font-size: 6px;
    }

    .print-controls,
    #loading,
    #error {
        display: none !important;
    }

    .print-row {
        display: grid !important;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important;
        gap: 2mm !important;
        margin-bottom: 2mm !important;
        width: 100% !important;
    }

    .group {
        width: 100% !important;
        min-width: 0 !important;
        margin-bottom: 2mm !important;
        break-inside: avoid !important;
        page-break-inside: avoid !important;
    }

    .group-title {
        background: white !important;
        color: black !important;
        border: 0.3mm solid black !important;
        font-size: 7px;
        padding: 1mm;
    }

    table {
        width: 100% !important;
        table-layout: fixed !important;
        border-collapse: collapse !important;
        margin: 0 !important;
    }

    th, td {
        width: auto !important;
        min-width: 0 !important;
        max-width: none !important;
        border: 0.25mm solid black !important;
        text-align: center !important;
        vertical-align: middle !important;
        padding: 0.8mm 0.3mm !important;
        overflow: hidden !important;
    }

    th {
        height: 5mm !important;
        font-size: 6px !important;
        background: white !important;
        color: black !important;
    }

    td {
        height: 7mm !important;
        background: white !important;
        color: black !important;
    }

    .print-coach-number {
        font-size: 9px !important;
        line-height: 1.1 !important;
    }

    .print-coach-meta {
        display: flex !important;
        flex-direction: row !important;
        justify-content: center !important;
        align-items: center !important;
        gap: 2px !important;
        flex-wrap: nowrap !important;
        white-space: nowrap !important;
        margin-top: 1px !important;
    }

    .print-coach-type,
    .print-coach-status {
        font-size: 6px !important;
        line-height: 1.1 !important;
    }

    .full-width {
        width: 100% !important;
        margin-bottom: 2mm !important;
    }
}
</style>
</head>

<body>

<div class="print-container">

    <div class="print-header">
        <h1>MR CO-ORDINATION DAILY COACHES POSITION</h1>
        <h2>LILUAH WORKSHOP</h2>
        <div id="printDate" class="print-date">--</div>
    </div>

    <div class="print-controls">
        <button class="print-btn" onclick="window.print()">PRINT</button>
        <button class="refresh-btn" onclick="location.reload()">REFRESH</button>
    </div>

    <div id="loading">Loading coach board...</div>
    <div id="error"></div>

    <div id="printArea">

        <!-- N SHOP + J SHOP -->
        <div class="print-row">

            <section class="group">
                <div class="group-title">N SHOP</div>
                <table>
                    <thead>
                        <tr>
                            <th>N2</th>
                            <th>N3</th>
                            <th>N5</th>
                            <th>N7</th>
                            <th>N8</th>
                        </tr>
                    </thead>
                    <tbody id="nTable"></tbody>
                </table>
            </section>

            <section class="group">
                <div class="group-title">J SHOP</div>
                <table>
                    <thead>
                        <tr>
                            <th>J1</th>
                            <th>J2</th>
                            <th>J3</th>
                            <th>J4</th>
                            <th>J5</th>
                            <th>J6</th>
                        </tr>
                    </thead>
                    <tbody id="jTable"></tbody>
                </table>
            </section>

        </div>

        <!-- LIFTING BAY + M SHOP -->
        <div class="print-row">

            <section class="group">
                <div class="group-title">LIFTING BAY</div>
                <table>
                    <thead>
                        <tr>
                            <th>L9</th>
                            <th>L10</th>
                        </tr>
                    </thead>
                    <tbody id="lTable"></tbody>
                </table>
            </section>

            <section class="group">
                <div class="group-title">M SHOP</div>
                <table>
                    <thead>
                        <tr>
                            <th>M2</th>
                            <th>M3</th>
                            <th>M4</th>
                            <th>M5</th>
                            <th>M6</th>
                        </tr>
                    </thead>
                    <tbody id="mTable"></tbody>
                </table>
            </section>

        </div>

        <!-- MR SCR SHOP -->
        <section class="group full-width">
            <div class="group-title">MR SCR SHOP</div>
            <table>
                <thead>
                    <tr>
                        <th>SCR9</th>
                        <th>SCR10</th>
                        <th>SCR11</th>
                        <th>SCR12</th>
                        <th>SCR13</th>
                        <th>SCR14</th>
                        <th>SCR15</th>
                        <th>SCR16</th>
                        <th>SCR18</th>
                        <th>SCR19</th>
                        <th>SCR21</th>
                        <th>SCR22</th>
                    </tr>
                </thead>
                <tbody id="scrTable"></tbody>
            </table>
        </section>

        <!-- CR SHOP -->
        <section class="group full-width">
            <div class="group-title">CR SHOP</div>
            <table>
                <thead>
                    <tr>
                        <th>F1</th>
                        <th>F2</th>
                        <th>F3</th>
                        <th>F4</th>
                        <th>F5</th>
                        <th>F6</th>
                        <th>F7</th>
                        <th>F8</th>
                        <th>F9</th>
                        <th>F10</th>
                        <th>F11</th>
                    </tr>
                </thead>
                <tbody id="crTable"></tbody>
            </table>
        </section>

    </div>
</div>

<script type="module" src="js/print.js?v=150"></script>

</body>
</html>
