
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MR CO-ORDINATION - PRINT</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #fff;
    color: #000;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    padding: 10px;
}

.print-container {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
}

.print-header {
    text-align: center;
    margin-bottom: 8px;
}

.print-header h1 {
    margin: 0;
    font-size: 20px;
    line-height: 1.1;
    font-weight: 700;
}

.print-header h2 {
    margin: 3px 0 0;
    font-size: 13px;
}

.print-date {
    margin-top: 3px;
    font-size: 9px;
}

.print-controls {
    text-align: center;
    margin-bottom: 10px;
}

.print-btn, .refresh-btn {
    border: 0;
    color: #fff;
    padding: 7px 18px;
    border-radius: 5px;
    font-size: 12px;
    cursor: pointer;
}

.print-btn {
    background: #0d6efd;
}

.refresh-btn {
    background: #198754;
    margin-left: 5px;
}

#printArea {
    width: 100%;
    max-width: none;
    margin: 0 auto;
}

/* TWO COLUMN ROWS */
.print-row {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 5px;
    margin-bottom: 6px;
    align-items: start;
}

/* SHOP GROUP */
.group {
    width: 100%;
    min-width: 0;
    margin: 0;
    break-inside: avoid;
    page-break-inside: avoid;
}

/* SHOP TITLE - WHITE */
.group-title {
    width: 100%;
    background: #fff;
    color: #000;
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    padding: 4px;
    line-height: 1.2;
    border: none;
}

/* ALL TABLES */
#printArea table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
    margin: 0;
}

/* EQUAL COLUMNS + BLACK BORDER */
#printArea th,
#printArea td {
    width: auto;
    min-width: 0;
    max-width: none;
    box-sizing: border-box;
    text-align: center;
    vertical-align: middle;
    border: 1px solid #000;
    padding: 2px;
    background: #fff;
    color: #000;
    overflow: hidden;
}

/* LINE HEADING */
#printArea th {
    height: 20px;
    font-size: 14px;
    font-weight: 700;
}

/* COACH CELL */
#printArea td {
    height: 9mm;
    min-height: 9mm;
    padding: 1mm;
}

/* COACH NUMBER */
.print-coach-number {
    display: block;
    font-size: 14px;
    font-weight: 800;
    line-height: 1.2;
    text-align: center;
    white-space: nowrap;
    margin-bottom: 1mm;
}

/* TYPE AND STATUS SIDE BY SIDE */
.print-coach-meta {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 4px;
    flex-wrap: nowrap;
    white-space: nowrap;
    line-height: 1.1;
}

.print-coach-type,
.print-coach-status {
    display: inline-block;
    font-size: 8px;
    font-weight: 700;
    line-height: 1.1;
    white-space: nowrap;
    margin: 0;
    padding: 0;
}

/* FULL WIDTH SHOPS */
.full-width {
    width: 100%;
    margin-bottom: 6px;
}

/* LOADING */
#loading {
    text-align: center;
    padding: 12px;
    font-size: 12px;
    font-weight: bold;
}

/* ERROR */
#error {
    text-align: center;
    color: red;
    padding: 8px;
    font-size: 12px;
    font-weight: bold;
}

/* MOBILE */
@media screen and (max-width: 768px) {
    .print-container {
        max-width: 100%;
    }

    #printArea {
        overflow-x: auto;
    }

    .print-header h1 {
        font-size: 16px;
    }

    .print-row {
        gap: 4px;
    }

    .group-title {
        font-size: 8px;
    }

    #printArea th {
        font-size: 6px;
    }

    .print-coach-number {
        font-size: 11px;
    }

    .print-coach-type,
    .print-coach-status {
        font-size: 7px;
    }
}

/* A4 LANDSCAPE */
@page {
    size: A4 landscape;
    margin: 5mm;
}

/* PRINT DESIGN */
@media print {

    html, body {
        width: 100%;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
    }

    body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .print-container {
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    .print-header {
        margin-bottom: 3mm;
    }

    .print-header h1 {
        font-size: 13px;
        line-height: 1.1;
    }

    .print-header h2 {
        font-size: 9px;
        margin-top: 2px;
    }

    .print-date {
        font-size: 6px;
        margin-top: 1px;
    }

    .print-controls,
    #loading,
    #error {
        display: none !important;
    }

    #printArea {
        width: 100% !important;
        max-width: none !important;
        height: auto !important;
        min-height: 0 !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
        gap: 3mm !important;
        overflow: visible !important;
    }

    /* N + J, LIFTING + M */
    .print-row {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        width: 100% !important;
        gap: 4mm !important;
        margin: 0 !important;
        align-items: start !important;
    }

    .group {
        width: 100% !important;
        min-width: 0 !important;
        margin: 0 !important;
        break-inside: avoid !important;
        page-break-inside: avoid !important;
    }

    /* SCR + CR FULL WIDTH */
    .full-width {
        width: 100% !important;
        margin: 0 !important;
        break-inside: avoid !important;
        page-break-inside: avoid !important;
    }

    /* TABLES */
    #printArea table {
        width: 100% !important;
        table-layout: fixed !important;
        border-collapse: collapse !important;
        margin: 0 !important;
    }

    /* EQUAL COLUMN WIDTH */
    #printArea th,
    #printArea td {
        width: auto !important;
        min-width: 0 !important;
        max-width: none !important;
        border: 1px solid #000 !important;
        background: #fff !important;
        color: #000 !important;
        text-align: center !important;
        vertical-align: middle !important;
        overflow: hidden !important;
        padding: 1mm !important;
    }

    /* LINE HEADER */
    #printArea th {
        height: 6mm !important;
        font-size: 6px !important;
        font-weight: 700 !important;
    }

    /* COACH CELL HEIGHT */
    #printArea td {
        height: 9mm !important;
        min-height: 9mm !important;
        padding: 1mm !important;
    }

    /* COACH NUMBER */
    .print-coach-number {
        font-size: 12px !important;
        font-weight: 800 !important;
        line-height: 1.2 !important;
        margin-bottom: 1mm !important;
    }

    /* TYPE + STATUS */
    .print-coach-meta {
        display: flex !important;
        flex-direction: row !important;
        justify-content: center !important;
        align-items: center !important;
        gap: 3px !important;
        flex-wrap: nowrap !important;
        white-space: nowrap !important;
    }

    .print-coach-type,
    .print-coach-status {
        display: inline-block !important;
        font-size: 7px !important;
        font-weight: 700 !important;
        line-height: 1.1 !important;
        white-space: nowrap !important;
    }

    /* WHITE SHOP TITLE */
    .group-title {
        background: #fff !important;
        color: #000 !important;
        border: none !important;
        font-size: 8px !important;
        font-weight: 700 !important;
        padding: 1.5mm !important;
    }
}
</style>
</head>

<body>

<div class="print-container">

    <div class="print-header">
        <h1>MR CO-ORDINATION DAILY COACHES POSITION</h1>
        <h2>LILUAH WORKSHOP</h2>
        <div id="printDate" class="print-date">--</div>
    </div>

    <div class="print-controls">
        <button class="print-btn" onclick="window.print()">PRINT</button>
        <button class="refresh-btn" onclick="location.reload()">REFRESH</button>
    </div>

    <div id="loading">Loading coach board...</div>
    <div id="error"></div>

    <div id="printArea">

        <!-- FIRST ROW: N SHOP + J SHOP -->
        <div class="print-row">

            <section class="group">
                <div class="group-title">N SHOP</div>
                <table>
                    <thead>
                        <tr>
                            <th>N2</th>
                            <th>N3</th>
                            <th>N5</th>
                            <th>N7</th>
                            <th>N8</th>
                        </tr>
                    </thead>
                    <tbody id="nTable"></tbody>
                </table>
            </section>

            <section class="group">
                <div class="group-title">J SHOP</div>
                <table>
                    <thead>
                        <tr>
                            <th>J1</th>
                            <th>J2</th>
                            <th>J3</th>
                            <th>J4</th>
                            <th>J5</th>
                            <th>J6</th>
                        </tr>
                    </thead>
                    <tbody id="jTable"></tbody>
                </table>
            </section>

        </div>

        <!-- SECOND ROW: LIFTING BAY + M SHOP -->
        <div class="print-row">

            <section class="group">
                <div class="group-title">LIFTING BAY</div>
                <table>
                    <thead>
                        <tr>
                            <th>L9</th>
                            <th>L10</th>
                        </tr>
                    </thead>
                    <tbody id="lTable"></tbody>
                </table>
            </section>

            <section class="group">
                <div class="group-title">M SHOP</div>
                <table>
                    <thead>
                        <tr>
                            <th>M2</th>
                            <th>M3</th>
                            <th>M4</th>
                            <th>M5</th>
                            <th>M6</th>
                        </tr>
                    </thead>
                    <tbody id="mTable"></tbody>
                </table>
            </section>

        </div>

        <!-- FULL WIDTH: MR SCR SHOP -->
        <section class="group full-width">
            <div class="group-title">MR SCR SHOP</div>
            <table>
                <thead>
                    <tr>
                        <th>SCR9</th>
                        <th>SCR10</th>
                        <th>SCR11</th>
                        <th>SCR12</th>
                        <th>SCR13</th>
                        <th>SCR14</th>
                        <th>SCR15</th>
                        <th>SCR16</th>
                        <th>SCR18</th>
                        <th>SCR19</th>
                        <th>SCR21</th>
                        <th>SCR22</th>
                    </tr>
                </thead>
                <tbody id="scrTable"></tbody>
            </table>
        </section>

        <!-- FULL WIDTH: CR SHOP -->
        <section class="group full-width">
            <div class="group-title">CR SHOP</div>
            <table>
                <thead>
                    <tr>
                        <th>F1</th>
                        <th>F2</th>
                        <th>F3</th>
                        <th>F4</th>
                        <th>F5</th>
                        <th>F6</th>
                        <th>F7</th>
                        <th>F8</th>
                        <th>F9</th>
                        <th>F10</th>
                        <th>F11</th>
                    </tr>
                </thead>
                <tbody id="crTable"></tbody>
            </table>
        </section>

    </div>
</div>

<script type="module" src="js/print.js?v=153"></script>

</body>
</html>
