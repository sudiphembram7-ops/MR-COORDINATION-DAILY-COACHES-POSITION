<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MR CO-ORDINATION - A4 PRINT</title>

    <style>

        /* =====================================================
           A4 LANDSCAPE
        ===================================================== */

        @page{
            size:A4 landscape;
            margin:4mm;
        }

        *{
            box-sizing:border-box;
        }

        html,
        body{
            margin:0;
            padding:0;
            width:100%;
            background:#fff;
            font-family:Arial,Helvetica,sans-serif;
        }

        body{
            color:#000;
        }


        /* =====================================================
           SCREEN CONTROL
        ===================================================== */

        .printControls{
            position:fixed;
            top:10px;
            right:10px;
            z-index:9999;
            display:flex;
            gap:6px;
        }

        .printControls button{
            border:0;
            border-radius:5px;
            padding:8px 14px;
            font-size:13px;
            font-weight:700;
            cursor:pointer;
            color:#fff;
            background:#198754;
        }

        .printControls button.closeBtn{
            background:#dc3545;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        #loading{
            position:fixed;
            inset:0;
            z-index:9998;
            background:#fff;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:18px;
            font-weight:700;
        }


        /* =====================================================
           MAIN PRINT PAGE
        ===================================================== */

        #printPage{
            width:100%;
            max-width:289mm;
            margin:0 auto;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .printHeader{
            text-align:center;
            margin-bottom:2mm;
        }

        .printHeader h1{
            margin:0;
            font-size:13px;
            line-height:1;
            font-weight:700;
        }

        .printHeader h2{
            margin:1mm 0 0;
            font-size:9px;
            line-height:1;
            font-weight:700;
        }

        #printDate{
            margin-top:1mm;
            font-size:6px;
        }


        /* =====================================================
           FORMAT 2 ROW
        ===================================================== */

        .formatRow{
            width:100%;
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:2mm;
            margin-bottom:2mm;
            align-items:start;
        }


        /* =====================================================
           SHOP BOX
        ===================================================== */

        .shopBox{
            width:100%;
            border:0.35mm solid #222;
            break-inside:avoid;
            page-break-inside:avoid;
        }

        .shopTitle{
            width:100%;
            text-align:center;
            font-size:8px;
            font-weight:700;
            line-height:1;
            padding:1.2mm 0;
            background:#ffc107;
            border-bottom:0.35mm solid #222;
        }


        /* =====================================================
           PRINT TABLE
        ===================================================== */

        .printTable{
            width:100%;
            border-collapse:collapse;
            table-layout:fixed;
        }

        .printTable th,
        .printTable td{
            border:0.25mm solid #555;
            padding:0;
            margin:0;
            text-align:center;
            vertical-align:middle;
            overflow:hidden;
            white-space:nowrap;
        }

        .printTable thead th{
            height:5mm;
            background:#20282c;
            color:#fff;
            font-size:5.5px;
            font-weight:700;
        }

        .printTable tbody th{
            width:11mm;
            height:6mm;
            background:#20282c;
            color:#fff;
            font-size:5.5px;
            font-weight:700;
        }

        .printTable tbody td{
            height:6mm;
            background:#fff;
            color:#000;
            font-size:7px;
            font-weight:700;
            line-height:1;
        }

        .positionHead{
            width:11mm;
        }

        .coachNumber{
            display:block;
            width:100%;
            font-size:7px;
            font-weight:700;
            line-height:1;
            text-align:center;
        }


        /* =====================================================
           FULL WIDTH SHOP
        ===================================================== */

        .fullWidth{
            width:100%;
            margin-bottom:2mm;
            break-inside:avoid;
            page-break-inside:avoid;
        }

        .fullWidth .printTable tbody td{
            height:6.5mm;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .printFooter{
            text-align:center;
            font-size:5.5px;
            margin-top:1mm;
        }


        /* =====================================================
           ERROR
        ===================================================== */

        .errorMessage{
            text-align:center;
            font-size:11px;
            font-weight:700;
            padding:10mm;
            color:#b00020;
        }


        /* =====================================================
           SCREEN PREVIEW
        ===================================================== */

        @media screen{

            #printPage{
                margin-top:65px;
                padding:0 5px 15px;
            }

        }


        /* =====================================================
           PRINT MODE
        ===================================================== */

        @media print{

            html,
            body{
                width:100%;
                height:auto;
                overflow:visible;
            }

            .printControls,
            #loading{
                display:none !important;
            }

            #printPage{
                width:100%;
                max-width:none;
                margin:0;
                padding:0;
            }

            .formatRow,
            .shopBox,
            .fullWidth{
                break-inside:avoid;
                page-break-inside:avoid;
            }

            .printHeader{
                break-after:avoid;
                page-break-after:avoid;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         SCREEN BUTTONS
    ===================================================== -->

    <div class="printControls">

        <button
            type="button"
            onclick="window.print()"
        >
            PRINT A4
        </button>

        <button
            type="button"
            class="closeBtn"
            onclick="window.close()"
        >
            CLOSE
        </button>

    </div>


    <!-- =====================================================
         LOADING
    ===================================================== -->

    <div id="loading">
        Loading Coach Board...
    </div>


    <!-- =====================================================
         PRINT PAGE
    ===================================================== -->

    <main id="printPage">


        <!-- HEADER -->

        <header class="printHeader">

            <h1>
                MR CO-ORDINATION DAILY COACHES POSITION
            </h1>

            <h2>
                LILUAH WORKSHOP
            </h2>

            <div id="printDate">
                --
            </div>

        </header>


        <!-- =================================================
             FORMAT 2
        ================================================= -->

        <div id="printArea"></div>


        <div class="printFooter">
            MR CO-ORDINATION &nbsp; | &nbsp; Coach Number Position
        </div>


    </main>


    <!-- =====================================================
         PRINT JS
    ===================================================== -->

    <script
        type="module"
        src="js/print.js"
    ></script>


</body>

</html>
