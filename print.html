
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MR CO-ORDINATION - PRINT</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #fff;
    color: #000;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    padding: 10px;
}

.print-container {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
}

.print-header {
    text-align: center;
    margin-bottom: 8px;
}

.print-header h1 {
    margin: 0;
    font-size: 20px;
    line-height: 1.1;
    font-weight: 700;
}

.print-header h2 {
    margin: 3px 0 0;
    font-size: 13px;
}

.print-date {
    margin-top: 3px;
    font-size: 9px;
}

.print-controls {
    text-align: center;
    margin-bottom: 10px;
}

.print-btn, .refresh-btn {
    border: 0;
    color: #fff;
    padding: 7px 18px;
    border-radius: 5px;
    font-size: 12px;
    cursor: pointer;
}

.print-btn {
    background: #0d6efd;
}

.refresh-btn {
    background: #198754;
    margin-left: 5px;
}

#printArea {
    width: 100%;
    max-width: 1050px;
    margin: 0 auto;
}

/* TWO COLUMN LAYOUT */
.print-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
    margin-bottom: 5px;
}

/* SHOP GROUP */
.group {
    width: 100%;
    margin: 0;
    break-inside: avoid;
    page-break-inside: avoid;
}

.group-title {
    background: #000;
    color: #fff;
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 4px;
    line-height: 1;
    border: 1px solid #000;
}


/* SAME COLUMN WIDTH IN EVERY SHOP TABLE */
table {
    width: max-content !important;
    table-layout: fixed !important;
    border-collapse: collapse !important;
}

/* EVERY COLUMN EXACTLY 70px */
th,
td {
    width: 70px !important;
    min-width: 70px !important;
    max-width: 70px !important;

    box-sizing: border-box !important;
    text-align: center !important;
    vertical-align: middle !important;
    padding: 2px !important;
    overflow: hidden !important;
}

/* Coach details */
.print-coach-number {
    white-space: nowrap;
    font-size: 10px;
    font-weight: bold;
}

.print-coach-meta {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 3px;
    flex-wrap: nowrap;
    white-space: nowrap;
    font-size: 7px;
}


/* POSITION COLUMN */
#printArea table th:first-child,
#printArea table td:first-child {
    width: 12% !important;
    white-space: nowrap !important;
    text-align: center !important;
    font-weight: 700 !important;
}

.full-width {
    width: 100%;
    margin-bottom: 5px;
}

#loading {
    text-align: center;
    padding: 12px;
    font-size: 12px;
    font-weight: bold;
}

#error {
    text-align: center;
    color: red;
    padding: 8px;
    font-size: 12px;
    font-weight: bold;
}

/* MOBILE */
@media (max-width: 768px) {
    .print-container,
    #printArea {
        max-width: 100%;
    }

    .print-row {
        grid-template-columns: 1fr 1fr;
        gap: 3px;
    }

    .print-header h1 {
        font-size: 18px;
    }

    .group-title {
        font-size: 9px;
    }

    th {
        font-size: 6px;
    }

    td {
        font-size: 6.5px;
        height: 13px;
    }
}

/* COACH DETAILS */
.print-coach-number {
    font-size: 14px !important;
    font-weight: 700 !important;
    line-height: 1.15 !important;
    display: block;
}

.print-coach-meta {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    line-height: 1.05;
}

.print-coach-type,
.print-coach-status {
    font-size: 8px !important;
    font-weight: 600 !important;
    line-height: 1.05 !important;
    display: block;
}

#printArea td {
    height: auto;
    vertical-align: middle;
    padding: 2px;
}

/* A4 LANDSCAPE */
@page {
    size: A4 landscape;
    margin: 8mm;
}

@media print {
    html, body {
        width: auto;
        height: auto;
        margin: 0;
        padding: 0;
        background: #fff;
    }

    body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .print-container {
        width: 250mm;
        max-width: 250mm;
        margin: 0 auto;
        padding: 0;
    }

    .print-header {
        margin-bottom: 4px;
    }

    .print-header h1 {
        font-size: 13px;
        line-height: 1.05;
    }

    .print-header h2 {
        font-size: 9px;
        margin-top: 2px;
    }

    .print-date {
        font-size: 6px;
        margin-top: 1px;
    }

    .print-controls,
    #loading,
    #error {
        display: none !important;
    }

    #printArea {
        width: 250mm;
        max-width: 250mm;
        margin: 0 auto;
    }

    .print-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3mm;
        margin-bottom: 3mm;
    }

    .full-width {
        margin-bottom: 3mm;
    }

    .group {
        break-inside: avoid;
        page-break-inside: avoid;
    }

    .group-title {
        font-size: 7px;
        padding: 1.5mm 1mm;
        line-height: 1;
    }

    table {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
        margin: 0;
    }

    th, td {
        padding: 0.7mm 0.5mm;
        line-height: 1.1;
        border: 0.3mm solid #000;
    }

    th {
        font-size: 5.5px;
        height: 6mm;
        font-weight: 700;
    }

    td {
        font-size: 6px;
        height: 5.5mm;
        font-weight: 600;
    }

    #printArea table th:first-child,
    #printArea table td:first-child {
        width: 12% !important;
        min-width: 12% !important;
        white-space: nowrap !important;
        display: table-cell !important;
        visibility: visible !important;
        color: #000 !important;
        font-weight: 700 !important;
    }

    .print-coach-number {
        font-size: 14px !important;
    }

    .print-coach-type,
    .print-coach-status {
        font-size: 8px !important;
    }

    table, tbody, tr {
        height: auto;
    }
}
/* All shop tables: fixed and equal columns */
table {
  width: 100% !important;
  table-layout: fixed !important;
  border-collapse: collapse !important;
}

/* Coach cells and headings */
th,
td {
  width: 35px !important;
  min-width: 35px !important;
  max-width: 35px !important;

  height: 15px !important;
  min-height: 15px !important;

  padding: 1px !important;
  box-sizing: border-box !important;
  text-align: center !important;
  vertical-align: middle !important;

  overflow: hidden;
  overflow-wrap: anywhere;
  word-break: break-word;
}

/* Keep coach details compact */
td {
  line-height: 11px !important;
}

/* FIXED TABLE COLUMNS */
table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
}

/* CELL SIZE */
th,
td {
    box-sizing: border-box;
    text-align: center;
    vertical-align: middle;
    padding: 1px !important;
    overflow: hidden;
}

/* COACH NUMBER */
.print-coach-number {
    display: block;
    font-size: 10px;
    font-weight: bold;
    line-height: 12px;
    white-space: nowrap;
}

/* TYPE AND STATUS SAME LINE */
.print-coach-meta {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 3px;
    flex-wrap: nowrap;
    white-space: nowrap;
    line-height: 10px;
    font-size: 7px;
}

.print-coach-type,
.print-coach-status {
    display: inline-block;
    white-space: nowrap;
    font-size: 7px;
    font-weight: bold;
    margin: 0;
    padding: 0;
}

</style>
</head>

<body>

<div class="print-container">

    <div class="print-header">
        <h1>MR CO-ORDINATION DAILY COACHES POSITION</h1>
        <h2>LILUAH WORKSHOP</h2>
        <div id="printDate" class="print-date">--</div>
    </div>

    <div class="print-controls">
        <button class="print-btn" onclick="window.print()">PRINT</button>
        <button class="refresh-btn" onclick="location.reload()">REFRESH</button>
    </div>

    <div id="loading">Loading coach board...</div>
    <div id="error"></div>

    <div id="printArea">

        <!-- FIRST ROW: N SHOP + J SHOP -->
        <div class="print-row">

            <section class="group">
                <div class="group-title">N SHOP</div>
                <table>
                    <thead>
                        <tr>
                            <th>N2</th>
                            <th>N3</th>
                            <th>N5</th>
                            <th>N7</th>
                            <th>N8</th>
                        </tr>
                    </thead>
                    <tbody id="nTable"></tbody>
                </table>
            </section>

            <section class="group">
                <div class="group-title">J SHOP</div>
                <table>
                    <thead>
                        <tr>
                           
                            <th>J1</th>
                            <th>J2</th>
                            <th>J3</th>
                            <th>J4</th>
                            <th>J5</th>
                            <th>J6</th>
                        </tr>
                    </thead>
                    <tbody id="jTable"></tbody>
                </table>
            </section>

        </div>

        <!-- SECOND ROW: LIFTING BAY + M SHOP -->
        <div class="print-row">

            <section class="group">
                <div class="group-title">LIFTING BAY</div>
                <table>
                    <thead>
                        <tr>
                           
                            <th>L9</th>
                            <th>L10</th>
                        </tr>
                    </thead>
                    <tbody id="lTable"></tbody>
                </table>
            </section>

            <section class="group">
                <div class="group-title">M SHOP</div>
                <table>
                    <thead>
                        <tr>
                            
                            <th>M2</th>
                            <th>M3</th>
                            <th>M4</th>
                            <th>M5</th>
                            <th>M6</th>
                        </tr>
                    </thead>
                    <tbody id="mTable"></tbody>
                </table>
            </section>

        </div>

        <!-- FULL WIDTH: MR SCR SHOP -->
        <section class="group full-width">
            <div class="group-title">MR SCR SHOP</div>
            <table>
                <thead>
                    <tr>
                        <th>SCR9</th>
                        <th>SCR10</th>
                        <th>SCR11</th>
                        <th>SCR12</th>
                        <th>SCR13</th>
                        <th>SCR14</th>
                        <th>SCR15</th>
                        <th>SCR16</th>
                        <th>SCR18</th>
                        <th>SCR19</th>
                        <th>SCR21</th>
                        <th>SCR22</th>
                    </tr>
                </thead>
                <tbody id="scrTable"></tbody>
            </table>
        </section>

        <!-- FULL WIDTH: CR SHOP -->
        <section class="group full-width">
            <div class="group-title">CR SHOP</div>
            <table>
                <thead>
                    <tr>
                       
                        <th>F1</th>
                        <th>F2</th>
                        <th>F3</th>
                        <th>F4</th>
                        <th>F5</th>
                        <th>F6</th>
                        <th>F7</th>
                        <th>F8</th>
                        <th>F9</th>
                        <th>F10</th>
                        <th>F11</th>
                    </tr>
                </thead>
                <tbody id="crTable"></tbody>
            </table>
        </section>

    </div>
</div>

<script type="module" src="js/print.js?v=143"></script>

</body>
</html>
