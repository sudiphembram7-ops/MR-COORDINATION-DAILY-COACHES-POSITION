<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MR CO-ORDINATION PRINT</title>

    <link
        rel="stylesheet"
        href="css/print.css"
    >

</head>

<body>

    <div class="print-page">

        <!-- HEADER -->
        <header class="print-header">

            <div class="railway-title">
                INDIAN RAILWAYS
            </div>

            <div class="workshop-title">
                LILUAH WORKSHOP
            </div>

            <div class="main-title">
                MR CO-ORDINATION
            </div>

            <div class="sub-title">
                DAILY COACHES POSITION
            </div>

            <div class="date-time">
                <span id="liveDate">--/--/----</span>
                <span>|</span>
                <span id="liveTime">--:--:--</span>
            </div>

        </header>


        <!-- SUMMARY -->
        <div class="summary">

            <span>
                TOTAL:
                <b id="totalCount">0</b>
            </span>

            <span>
                OCCUPIED:
                <b id="occupiedCount">0</b>
            </span>

        </div>


        <!-- PRINT TABLE -->
        <table id="printTable">

            <thead>

                <tr>

                    <th>SHOP</th>

                    <th>LINE</th>

                    <th>POSITION</th>

                    <th>COACH NUMBER</th>

                </tr>

            </thead>

            <tbody id="printBody">

            </tbody>

        </table>


        <div
            id="noData"
            class="no-data"
            style="display:none;"
        >
            No coach data available.
        </div>


        <!-- FOOTER -->
        <footer>

            MR CO-ORDINATION / LILUAH WORKSHOP

            <span>
                Printed:
                <span id="printTime">--:--:--</span>
            </span>

        </footer>

    </div>


    <script
        type="module"
        src="js/print.js"
    ></script>

</body>

</html>
