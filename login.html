<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR CO-ORDINATION LOGIN</title>
</head>
<body>

<div class="login-box">
    <h2>MR CO-ORDINATION LOGIN</h2>

    <input
        type="email"
        id="email"
        placeholder="Email">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button onclick="login()">
        LOGIN
    </button>

    <p id="message"></p>
</div>

<script type="module" src="login.js"></script>

</body>
</html>
