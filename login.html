<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MR Admin Login</title>


    <!-- =================================================
         BOOTSTRAP
    ================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =================================================
         MR CO-ORDINATION CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="login-page">


    <!-- =================================================
         LOGIN BOX
    ================================================== -->

    <div class="login-box">


        <!-- HEADER -->

        <h2>
            INDIAN RAILWAYS
        </h2>


        <h4>
            MR CO-ORDINATION
        </h4>


        <hr>


        <!-- =================================================
             EMAIL
        ================================================== -->

        <label
            for="email"
            class="form-label">

            Admin Email

        </label>


        <input
            type="email"
            id="email"
            class="form-control mb-3"
            placeholder="Enter Admin Email"
            autocomplete="username"
            required
        >


        <!-- =================================================
             PASSWORD
        ================================================== -->

        <label
            for="password"
            class="form-label">

            Password

        </label>


        <input
            type="password"
            id="password"
            class="form-control mb-3"
            placeholder="Enter Password"
            autocomplete="current-password"
            required
        >


        <!-- =================================================
             LOGIN BUTTON
        ================================================== -->

        <button
            type="button"
            id="loginBtn"
            class="btn btn-primary w-100">

            LOGIN

        </button>


        <!-- =================================================
             LOGIN MESSAGE
        ================================================== -->

        <p
            id="message"
            class="mt-3 text-center"
            aria-live="polite">
        </p>


        <!-- =================================================
             BACK TO BOARD
        ================================================== -->

        <div
            class="text-center mt-3">

            <a href="board.html">

                Back to Live Board

            </a>

        </div>


    </div>


    <!-- =================================================
         LOGIN JS
    ================================================== -->

    <script
        type="module"
        src="./js/login.js">
    </script>


</body>

</html>
