
<<!DOCTYPE html>
<html lang="en">

<body class="bg-light">

<div class="container-fluid mt-3">

</h3>

<div class="card-body">

</div>

<div class="col-md-6 text-end">

<button

onclick="location.reload()">

Refresh

</button>

</div>

<div class="table-responsive">

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>Date</th>
<th>Shop</th>
<th>Line</th>
<th>Position</th>
<th>Coach No</th>
<th>Coach Type</th>
<th>Status</th>

<tbody id="historyBody">

</div>

</div>

</div>

</div>

<script type="module">

import { database } from "./js/firebase-config.js";

import {
ref,
onValue
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

const historyBody =
document.getElementById("historyBody");

onValue(ref(database,"auditLog"),(snapshot)=>{

historyBody.innerHTML="";

if(!snapshot.exists()) return;

const data=snapshot.val();

const list=Object.values(data).reverse();

list.forEach(item=>{

historyBody.innerHTML += `

<tr>

<td>${new Date(item.time).toLocaleString("en-IN")}</td>

<td>${item.shop||""}</td>

<td>${item.line||""}</td>

<td>${item.position||""}</td>

<td>${item.coachNo||""}</td>

<td>${item.coachType||""}</td>

<td>${item.status||""}</td>

<td>${item.user||""}</td>

<td>${item.action||""}</td>

</tr>

`;

});

});

document.getElementById("searchHistory")
.addEventListener("keyup",function(){

const value=this.value.toUpperCase();

document.querySelectorAll("#historyBody tr")
.forEach(row=>{

row.style.display=row.innerText.toUpperCase().includes(value)
? ""
: "none";

});

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
