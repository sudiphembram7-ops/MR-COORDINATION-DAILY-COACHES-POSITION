<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coach History</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<style>
.table-responsive{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
}

#historyTable{
    min-width:1100px;
}

#historyTable th,
#historyTable td{
    white-space:nowrap;
    text-align:center;
    vertical-align:middle;
    padding:10px;
}

#historyTable thead th{
    position:sticky;
    top:0;
    z-index:2;
}

@media(max-width:768px){

    .container-fluid{
        padding:8px;
    }

    .card-header h3{
        font-size:28px;
    }

    #historyTable{
        min-width:1000px;
    }

    #historyTable th,
    #historyTable td{
        font-size:13px;
        padding:8px;
    }

    .btn{
        width:100%;
    }
}
</style>

</head>

<body class="bg-light">

<div class="container-fluid mt-3">

<div class="card shadow">

<div class="card-header bg-dark text-white">
<h3 class="text-center mb-0">
Coach Movement History
</h3>
</div>

<div class="card-body">

<div class="row g-2 mb-3 align-items-center">

<div class="col-8 col-md-9">

<input
type="text"
id="searchHistory"
class="form-control"
placeholder="Search Coach Number">

</div>

<div class="col-4 col-md-3 d-grid">

<button
class="btn btn-primary"
onclick="location.reload()">

Refresh

</button>

</div>

</div>

<div class="table-responsive">

<table
id="historyTable"
class="table table-bordered table-hover table-striped align-middle">

<thead class="table-dark">

<tr>

<th>Date</th>
<th>Shop</th>
<th>Line</th>
<th>Position</th>
<th>Coach No</th>
<th>Coach Type</th>
<th>Status</th>
<th>User</th>
<th>Action</th>

</tr>

</thead>

<tbody id="historyBody">

</tbody>

</table>

</div>

</div>

</div>

</div>

<script type="module">

import { database } from "./js/firebase-config.js";

import {
ref,
onValue
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

const historyBody =
document.getElementById("historyBody");

onValue(ref(database,"auditLog"),(snapshot)=>{

historyBody.innerHTML="";

if(!snapshot.exists()) return;

const data=snapshot.val();

const list=Object.values(data).reverse();

list.forEach(item=>{

historyBody.innerHTML += `

<tr>

<td>${new Date(item.time).toLocaleString("en-IN")}</td>

<td>${item.shop||""}</td>

<td>${item.line||""}</td>

<td>${item.position||""}</td>

<td>${item.coachNo||""}</td>

<td>${item.coachType||""}</td>

<td>${item.status||""}</td>

<td>${item.user||""}</td>

<td>${item.action||""}</td>

</tr>

`;

});

});

document.getElementById("searchHistory")
.addEventListener("keyup",function(){

const value=this.value.toUpperCase();

document.querySelectorAll("#historyBody tr")
.forEach(row=>{

row.style.display=row.innerText.toUpperCase().includes(value)
? ""
: "none";

});

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
