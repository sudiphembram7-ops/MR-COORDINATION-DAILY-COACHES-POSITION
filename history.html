<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Coach Movement History</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="css/style.css"
>

<style>

/* =========================================================
   HISTORY PAGE
========================================================= */

body{
    background:#f5f6f8;
}


/* =========================================================
   TABLE
========================================================= */

.table-responsive{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
}

#historyTable{
    min-width:1450px;
}

#historyTable th,
#historyTable td{
    white-space:nowrap;
    text-align:center;
    vertical-align:middle;
    padding:10px 12px;
}

#historyTable thead th{
    position:sticky;
    top:0;
    z-index:5;
}


/* =========================================================
   ACTION BADGES
========================================================= */

.action-badge{
    display:inline-block;
    min-width:80px;
    padding:5px 10px;
    border-radius:6px;
    font-weight:700;
    font-size:13px;
}

.action-MOVE{
    background:#0d6efd;
    color:#fff;
}

.action-SWAP{
    background:#6f42c1;
    color:#fff;
}

.action-SAVE{
    background:#198754;
    color:#fff;
}

.action-UPDATE{
    background:#ffc107;
    color:#000;
}

.action-DELETE{
    background:#dc3545;
    color:#fff;
}

.action-STATUS_UPDATE{
    background:#fd7e14;
    color:#fff;
}

.action-RESTORE_BOARD{
    background:#20c997;
    color:#000;
}

.action-CLEAR_BOARD{
    background:#343a40;
    color:#fff;
}


/* =========================================================
   MOVEMENT
========================================================= */

.from-cell{
    font-weight:600;
}

.to-cell{
    font-weight:700;
}

.arrow{
    font-size:20px;
    font-weight:bold;
    padding:0 5px;
}


/* =========================================================
   SEARCH
========================================================= */

#searchHistory{
    font-size:18px;
    min-height:50px;
}

#refreshBtn{
    min-height:50px;
    font-size:18px;
    font-weight:600;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:768px){

    .container-fluid{
        padding:8px;
    }

    .card-header h3{
        font-size:27px;
    }

    #historyTable{
        min-width:1450px;
    }

    #historyTable th,
    #historyTable td{
        font-size:13px;
        padding:8px 10px;
    }

    #searchHistory{
        font-size:17px;
    }

    #refreshBtn{
        font-size:17px;
    }

}

</style>

</head>


<body>


<div class="container-fluid mt-3">

    <div class="card shadow">


        <!-- =================================================
             HEADER
        ================================================= -->

        <div class="card-header bg-dark text-white">

            <h3 class="text-center mb-0">
                Coach Movement History
            </h3>

        </div>


        <!-- =================================================
             BODY
        ================================================= -->

        <div class="card-body">


            <!-- =================================================
                 SEARCH
            ================================================= -->

            <div class="row g-2 mb-3 align-items-center">

                <div class="col-8 col-md-9">

                    <input
                        type="text"
                        id="searchHistory"
                        class="form-control"
                        placeholder="Search Coach / Shop / Line / Position / Action"
                    >

                </div>


                <div class="col-4 col-md-3 d-grid">

                    <button
                        type="button"
                        class="btn btn-primary"
                        id="refreshBtn"
                    >

                        Refresh

                    </button>

                </div>

            </div>


            <!-- =================================================
                 TABLE
            ================================================= -->

            <div class="table-responsive">

                <table
                    id="historyTable"
                    class="table table-bordered table-hover table-striped align-middle"
                >

                    <thead class="table-dark">

                        <tr>

                            <th>Date / Time</th>

                            <th>Action</th>

                            <th>Shop</th>

                            <th>Coach No</th>

                            <th>Coach Type</th>

                            <th>Status</th>

                            <th>From Line</th>

                            <th>From Position</th>

                            <th>To Line</th>

                            <th>To Position</th>

                            <th>Swapped Coach</th>

                            <th>User</th>

                        </tr>

                    </thead>


                    <tbody id="historyBody">

                    </tbody>

                </table>

            </div>


        </div>

    </div>

</div>



<script type="module">


/* =========================================================
   FIREBASE
========================================================= */

import {
    database
} from "./js/firebase-config.js";

import {
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";


/* =========================================================
   ELEMENTS
========================================================= */

const historyBody =
    document.getElementById("historyBody");

const searchHistory =
    document.getElementById("searchHistory");

const refreshBtn =
    document.getElementById("refreshBtn");


/* =========================================================
   SAFE HTML
========================================================= */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   CLEAN
========================================================= */

function clean(value){

    return String(
        value ?? ""
    ).trim();

}


/* =========================================================
   SHOP FROM LINE
========================================================= */

function getShopFromLine(line){

    line =
        clean(line).toUpperCase();


    if(
        line.startsWith("SCR")
    ){

        return "MR SCR SHOP";

    }


    if(
        line.startsWith("N")
    ){

        return "N SHOP";

    }


    if(
        line.startsWith("M")
    ){

        return "M SHOP";

    }


    if(
        line.startsWith("F")
    ){

        return "CR SHOP";

    }


    if(
        line.startsWith("J")
    ){

        return "J SHOP";

    }


    if(
        line.startsWith("L")
    ){

        return "LIFTING BAY";

    }


    return "";

}


/* =========================================================
   GET DATE OBJECT
========================================================= */

function getHistoryDate(item){

    let date = null;


    /* -----------------------------------------------------
       Firebase Timestamp-like object
    ----------------------------------------------------- */

    if(
        item.time &&
        typeof item.time === "object" &&
        typeof item.time.toDate === "function"
    ){

        date =
            item.time.toDate();

    }


    /* -----------------------------------------------------
       Numeric time
    ----------------------------------------------------- */

    else if(
        typeof item.time === "number" &&
        item.time > 0
    ){

        date =
            new Date(item.time);

    }


    /* -----------------------------------------------------
       Numeric timestamp
    ----------------------------------------------------- */

    else if(
        typeof item.timestamp === "number" &&
        item.timestamp > 0
    ){

        date =
            new Date(item.timestamp);

    }


    /* -----------------------------------------------------
       String ISO time
    ----------------------------------------------------- */

    else if(
        typeof item.time === "string" &&
        item.time.trim()
    ){

        const parsed =
            new Date(item.time);

        if(
            !isNaN(parsed.getTime())
        ){

            date = parsed;

        }

    }


    /* -----------------------------------------------------
       String timestamp
    ----------------------------------------------------- */

    if(
        !date &&
        typeof item.timestamp === "string" &&
        item.timestamp.trim()
    ){

        const parsed =
            new Date(item.timestamp);

        if(
            !isNaN(parsed.getTime())
        ){

            date = parsed;

        }

    }


    /* -----------------------------------------------------
       createdAt
    ----------------------------------------------------- */

    if(
        !date &&
        item.createdAt
    ){

        const parsed =
            new Date(item.createdAt);

        if(
            !isNaN(parsed.getTime())
        ){

            date = parsed;

        }

    }


    /* -----------------------------------------------------
       Old date + time format
    ----------------------------------------------------- */

    if(
        !date &&
        item.date &&
        item.time
    ){

        const parsed =
            new Date(
                `${item.date} ${item.time}`
            );

        if(
            !isNaN(parsed.getTime())
        ){

            date = parsed;

        }

    }


    return date;

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatHistoryDate(item){

    const date =
        getHistoryDate(item);


    if(
        !date ||
        isNaN(date.getTime())
    ){

        return "—";

    }


    return date.toLocaleString(
        "en-IN",
        {
            day:"numeric",
            month:"numeric",
            year:"numeric",
            hour:"numeric",
            minute:"2-digit",
            second:"2-digit",
            hour12:true
        }
    );

}


/* =========================================================
   SORT TIME
========================================================= */

function getHistoryTime(item){

    const date =
        getHistoryDate(item);


    if(
        date &&
        !isNaN(date.getTime())
    ){

        return date.getTime();

    }


    return 0;

}


/* =========================================================
   ACTION BADGE
========================================================= */

function createActionBadge(action){

    const value =
        clean(action).toUpperCase();


    if(!value){

        return "";

    }


    return `
        <span class="action-badge action-${escapeHTML(value)}">
            ${escapeHTML(value)}
        </span>
    `;

}


/* =========================================================
   GET SHOP
========================================================= */

function getHistoryShop(item){

    /* Existing shop field */

    if(
        clean(item.shop)
    ){

        return clean(item.shop);

    }


    /* MOVE / SWAP */

    if(
        clean(item.fromLine)
    ){

        return getShopFromLine(
            item.fromLine
        );

    }


    /* Normal history */

    if(
        clean(item.line)
    ){

        return getShopFromLine(
            item.line
        );

    }


    return "";

}


/* =========================================================
   LOAD HISTORY
========================================================= */

function loadHistory(){

    onValue(

        ref(
            database,
            "history"
        ),

        snapshot => {

            historyBody.innerHTML = "";


            /* =================================================
               NO HISTORY
            ================================================= */

            if(
                !snapshot.exists()
            ){

                historyBody.innerHTML = `

                    <tr>

                        <td
                            colspan="12"
                            class="text-center"
                        >

                            No History Found

                        </td>

                    </tr>

                `;

                return;

            }


            /* =================================================
               OBJECT -> ARRAY
            ================================================= */

            const rawData =
                snapshot.val();


            const history =
                Object.entries(
                    rawData
                ).map(
                    ([key, value]) => ({

                        key,

                        ...(value || {})

                    })
                );


            /* =================================================
               NEWEST FIRST
            ================================================= */

            history.sort(
                (a,b) =>
                    getHistoryTime(b)
                    -
                    getHistoryTime(a)
            );


            /* =================================================
               ROWS
            ================================================= */

            history.forEach(
                item => {


                    const action =
                        clean(
                            item.action
                        ).toUpperCase();


                    const isMovement =
                        action === "MOVE" ||
                        action === "SWAP";


                    let fromLine = "";
                    let fromPosition = "";
                    let toLine = "";
                    let toPosition = "";
                    let swappedCoach = "";


                    /* -------------------------------------------------
                       MOVEMENT HISTORY
                    ------------------------------------------------- */

                    if(
                        isMovement
                    ){

                        fromLine =
                            clean(
                                item.fromLine
                            );

                        fromPosition =
                            clean(
                                item.fromPosition
                            );

                        toLine =
                            clean(
                                item.toLine
                            );

                        toPosition =
                            clean(
                                item.toPosition
                            );

                        swappedCoach =
                            clean(
                                item.swappedCoachNo
                            );

                    }


                    /* -------------------------------------------------
                       NORMAL HISTORY
                    ------------------------------------------------- */

                    else{

                        fromLine =
                            clean(
                                item.oldLine
                            );

                        fromPosition =
                            clean(
                                item.oldPosition
                            );

                        toLine =
                            clean(
                                item.line
                            );

                        toPosition =
                            clean(
                                item.position
                            );

                    }


                    const row =
                        document.createElement("tr");


                    /* -------------------------------------------------
                       MOVEMENT ROW
                    ------------------------------------------------- */

                    if(
                        isMovement
                    ){

                        row.innerHTML = `

                            <td>
                                ${escapeHTML(
                                    formatHistoryDate(item)
                                )}
                            </td>

                            <td>
                                ${createActionBadge(action)}
                            </td>

                            <td>
                                ${escapeHTML(
                                    getHistoryShop(item)
                                )}
                            </td>

                            <td>
                                <strong>
                                    ${escapeHTML(
                                        item.coachNo
                                    )}
                                </strong>
                            </td>

                            <td>
                                ${escapeHTML(
                                    item.coachType
                                )}
                            </td>

                            <td>
                                ${escapeHTML(
                                    item.status
                                )}
                            </td>

                            <td class="from-cell">
                                ${escapeHTML(
                                    fromLine
                                )}
                            </td>

                            <td class="from-cell">
                                ${escapeHTML(
                                    fromPosition
                                )}
                            </td>

                            <td class="to-cell">
                                ${escapeHTML(
                                    toLine
                                )}
                            </td>

                            <td class="to-cell">
                                ${escapeHTML(
                                    toPosition
                                )}
                            </td>

                            <td>
                                ${
                                    swappedCoach
                                        ? escapeHTML(
                                            swappedCoach
                                          )
                                        : "—"
                                }
                            </td>

                            <td>
                                ${escapeHTML(
                                    item.user || "Admin"
                                )}
                            </td>

                        `;

                    }


                    /* -------------------------------------------------
                       NORMAL ROW
                    ------------------------------------------------- */

                    else{

                        row.innerHTML = `

                            <td>
                                ${escapeHTML(
                                    formatHistoryDate(item)
                                )}
                            </td>

                            <td>
                                ${createActionBadge(action)}
                            </td>

                            <td>
                                ${escapeHTML(
                                    getHistoryShop(item)
                                )}
                            </td>

                            <td>
                                <strong>
                                    ${escapeHTML(
                                        item.coachNo
                                    )}
                                </strong>
                            </td>

                            <td>
                                ${escapeHTML(
                                    item.coachType
                                )}
                            </td>

                            <td>
                                ${escapeHTML(
                                    item.status
                                )}
                            </td>

                            <td>
                                ${
                                    fromLine
                                        ? escapeHTML(
                                            fromLine
                                          )
                                        : "—"
                                }
                            </td>

                            <td>
                                ${
                                    fromPosition
                                        ? escapeHTML(
                                            fromPosition
                                          )
                                        : "—"
                                }
                            </td>

                            <td>
                                ${
                                    toLine
                                        ? escapeHTML(
                                            toLine
                                          )
                                        : "—"
                                }
                            </td>

                            <td>
                                ${
                                    toPosition
                                        ? escapeHTML(
                                            toPosition
                                          )
                                        : "—"
                                }
                            </td>

                            <td>
                                —
                            </td>

                            <td>
                                ${escapeHTML(
                                    item.user || "Admin"
                                )}
                            </td>

                        `;

                    }


                    historyBody.appendChild(
                        row
                    );

                }
            );


            /* =================================================
               SEARCH
            ================================================= */

            applySearch();

        },

        error => {

            console.error(
                "HISTORY LOAD ERROR:",
                error
            );


            historyBody.innerHTML = `

                <tr>

                    <td
                        colspan="12"
                        class="text-center text-danger"
                    >

                        Firebase History Load Error

                    </td>

                </tr>

            `;

        }

    );

}


/* =========================================================
   SEARCH
========================================================= */

function applySearch(){

    const value =
        searchHistory.value
            .trim()
            .toUpperCase();


    document
        .querySelectorAll(
            "#historyBody tr"
        )
        .forEach(
            row => {

                const text =
                    row.innerText
                        .toUpperCase();


                row.style.display =
                    text.includes(value)
                        ? ""
                        : "none";

            }
        );

}


searchHistory.addEventListener(
    "input",
    applySearch
);


/* =========================================================
   REFRESH
========================================================= */

refreshBtn.addEventListener(
    "click",
    () => {

        location.reload();

    }
);


/* =========================================================
   START
========================================================= */

loadHistory();


</script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


</body>

</html>
