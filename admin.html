<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MR CO-ORDINATION ADMIN PANEL</title>

<!-- Bootstrap -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<!-- Bootstrap Icons -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet">

<!-- Custom CSS -->
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/style.css">

</head>


<body class="bg-light">


<div class="container-fluid py-3">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="card shadow-sm border-0 mb-3">

    <div class="card-body">

        <div class="d-flex justify-content-between align-items-center flex-wrap">

            <div>

                <h2 class="fw-bold text-primary mb-1">
                    MR CO-ORDINATION
                </h2>

                <h5 class="text-secondary">
                    ADMIN PANEL
                </h5>

            </div>


            <div class="text-end">

                <div
                    id="currentDate"
                    class="fw-bold">
                </div>

                <div
                    id="currentTime"
                    class="text-primary fs-5">
                </div>

            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     ADMIN BUTTONS
===================================================== -->

<div class="row g-2 mb-3">


    <!-- LIVE BOARD -->

    <div class="col-lg-4 col-md-6">

        <a
            href="board.html"
            class="btn btn-primary w-100">

            <i class="bi bi-grid"></i>

            LIVE BOARD

        </a>

    </div>


    <!-- REFRESH -->

    <div class="col-lg-4 col-md-6">

        <button
            class="btn btn-warning w-100"
            id="refreshBtn">

            <i class="bi bi-arrow-clockwise"></i>

            Refresh

        </button>

    </div>


    <!-- LOGOUT -->

    <div class="col-lg-4 col-md-6">

        <button
            class="btn btn-danger w-100"
            id="logoutBtn">

            <i class="bi bi-box-arrow-right"></i>

            Logout

        </button>

    </div>

</div>


<!-- =====================================================
     RECENT COACH ENTRY
===================================================== -->

<div class="card shadow-sm border-0 mb-3">


    <div class="card-header bg-primary text-white">

        <h5 class="mb-0">

            <i class="bi bi-clock-history"></i>

            Recent Coach Entry

        </h5>

    </div>


    <div class="card-body p-0">


        <div class="table-responsive">

            <table
                class="table table-bordered table-hover table-striped align-middle mb-0"
                id="historyTable">


                <thead class="table-dark">

                    <tr>

                        <th>Shop</th>

                        <th>Line</th>

                        <th>Position</th>

                        <th>Coach No</th>

                        <th>Coach Type</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="historyBody">

                    <!-- Firebase history will load here -->

                </tbody>


            </table>

        </div>

    </div>

</div>


<!-- =====================================================
     DATABASE STATUS
===================================================== -->

<div class="card shadow-sm border-0 mb-3">

    <div class="card-body">

        <div class="row text-center">


            <div class="col-md-4">

                <strong>
                    Firebase Database
                </strong>

                <div
                    id="databaseStatus"
                    class="text-success">

                    ● Checking...

                </div>

            </div>


            <div class="col-md-4">

                <strong>
                    Login Status
                </strong>

                <div
                    id="loginStatus"
                    class="text-success">

                    ● Checking...

                </div>

            </div>


            <div class="col-md-4">

                <strong>
                    Last Update
                </strong>

                <div id="lastUpdate">

                    --

                </div>

            </div>


        </div>

    </div>

</div>


</div>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="bg-dark text-white mt-4 p-3">

    <div class="row">


        <div class="col-md-4">

            <b>
                MR CO-ORDINATION
            </b>

            <br>

            Liluah Workshop

        </div>


        <div class="col-md-4 text-center">

            Current Time :

            <span id="footerTime">
                --
            </span>

        </div>


        <div class="col-md-4 text-end">

            Database :

            <span
                id="footerDatabase"
                class="text-success">

                ● Connected

            </span>

        </div>


    </div>

</footer>


<!-- =====================================================
     BOOTSTRAP JS
===================================================== -->

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- =====================================================
     ADMIN JS
===================================================== -->

<script
type="module"
src="js/admin.js">
</script>


<!-- =====================================================
     CLOCK
===================================================== -->

<script>

function updateClock(){

    const now = new Date();


    const date =
        document.getElementById("currentDate");

    const time =
        document.getElementById("currentTime");

    const footer =
        document.getElementById("footerTime");


    if(date){

        date.textContent =
            now.toLocaleDateString("en-IN");

    }


    if(time){

        time.textContent =
            now.toLocaleTimeString("en-IN");

    }


    if(footer){

        footer.textContent =
            now.toLocaleTimeString("en-IN");

    }

}


updateClock();

setInterval(updateClock,1000);

</script>


</body>

</html>
