<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MR CO-ORDINATION ADMIN PANEL</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

<div class="container-fluid py-3">

    <!-- Header -->
    <div class="card shadow-sm border-0 mb-3">
        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center flex-wrap">

                <div>
                    <h2 class="fw-bold text-primary mb-1">
                        MR CO-ORDINATION
                    </h2>

                    <h5 class="text-secondary">
                        ADMIN PANEL
                    </h5>
                </div>

                <div class="text-end">

                    <div id="currentDate" class="fw-bold"></div>

                    <div id="currentTime"
                        class="text-primary fs-5">
                    </div>

                </div>

            </div>

        </div>
    </div>

    <!-- Top Buttons -->
    <div class="row g-2 mb-3">

        <div class="col-lg-3 col-md-6">

            <button
                class="btn btn-success w-100"
                data-bs-toggle="modal"
                data-bs-target="#coachModal">

                <i class="bi bi-plus-circle"></i>

                Coach Entry

            </button>

        </div>

        <div class="col-lg-3 col-md-6">

            <a href="board.html"
               class="btn btn-primary w-100">

                <i class="bi bi-grid"></i>

                LIVE BOARD

            </a>

        </div>

        <div class="col-lg-3 col-md-6">

            <button
                class="btn btn-warning w-100"
                id="refreshBtn">

                <i class="bi bi-arrow-clockwise"></i>

                Refresh

            </button>

        </div>

        <div class="col-lg-3 col-md-6">

            <button
                class="btn btn-danger w-100"
                id="logoutBtn">

                <i class="bi bi-box-arrow-right"></i>

                Logout

            </button>

        </div>

    </div>
        <!-- ===========================
         Recent Coach Entry
    ============================ -->

    <div class="card shadow-sm border-0 mb-3">

        <div class="card-header bg-primary text-white">

            <h5 class="mb-0">
                <i class="bi bi-clock-history"></i>
                Recent Coach Entry
            </h5>

        </div>

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-bordered table-hover table-striped align-middle mb-0"
                       id="historyTable">

                    <thead class="table-dark">

                        <tr>

                            <th>Shop</th>
                            <th>Line</th>
                            <th>Position</th>
                            <th>Coach No</th>
                            <th>Coach Type</th>
                            <th>Status</th>
                            <th width="150">Action</th>

                        </tr>

                    </thead>

                    <tbody id="historyBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- ===========================
          Coach Entry Modal
    ============================ -->

    <div class="modal fade"
         id="coachModal"
         tabindex="-1"
         aria-hidden="true">

        <div class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header bg-success text-white">

                    <h5 class="modal-title">

                        <i class="bi bi-train-front-fill"></i>

                        Coach Entry

                    </h5>

                    <button type="button"
                            class="btn-close btn-close-white"
                            data-bs-dismiss="modal">

                    </button>

                </div>

                <div class="modal-body">

                    <div class="row g-3">

                        <!-- Shop -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Shop
                            </label>

                            <select
                                class="form-select"
                                id="shop">

                                <option value="">Select Shop</option>

                                <option>N SHOP</option>
                                <option>M SHOP</option>
                                <option>MR SCR SHOP</option>
                                <option>CR SHOP</option>
                                <option>J SHOP</option>
                                <option>LIFTING BAY</option>

                            </select>

                        </div>

                        <!-- Line -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Line
                            </label>

                            <select
                                class="form-select"
                                id="line">

                                <option value="">Select Line</option>

                            </select>

                        </div>

                        <!-- Position -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Position
                            </label>

                            <select
                                class="form-select"
                                id="position">

                                <option value="">
                                    Select Position
                                </option>

                            </select>

                        </div>

                        <!-- Coach Number -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Coach Number
                            </label>

                            <input
                                type="text"
                                id="coachNo"
                                class="form-control"
                                placeholder="Enter Coach Number">

                        </div>
                        
                                                <!-- Coach Type -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Coach Type
                            </label>

                            <select
                                class="form-select"
                                id="coachType">

                                <option value="">Select Coach Type</option>

                                <option>ICF</option>
                                <option>LHB</option>
                                <option>MEMU</option>
                                <option>EMU</option>
                                <option>DEMU</option>
                                <option>AC</option>
                                <option>NON AC</option>

                            </select>

                        </div>

                        <!-- Status -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Status
                            </label>

                            <select
                                class="form-select"
                                id="status">

                                <option value="">Select Status</option>

                                <option value="PO">PO</option>
                                <option value="LM">LM</option>
                                <option value="MED">MED</option>
                                <option value="RL">RL</option>
                                <option value="WIP">WIP</option>
                                <option value="HOLD">HOLD</option>

                            </select>

                        </div>

                    </div>

                    <hr>

                    <!-- Buttons -->

                    <div class="d-grid gap-2">

                        <button
                            id="saveBtn"
                            class="btn btn-success btn-lg">

                            <i class="bi bi-floppy"></i>

                            SAVE

                        </button>

                        <button
                            id="updateBtn"
                            class="btn btn-warning btn-lg">

                            <i class="bi bi-pencil-square"></i>

                            UPDATE

                        </button>

                        <button
                            id="deleteBtn"
                            class="btn btn-danger btn-lg">

                            <i class="bi bi-trash"></i>

                            DELETE

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Admin JS -->

<script type="module" src="js/firebase-config.js"></script>

<script type="module" src="js/admin.js"></script>

<script>
function updateClock(){

    const now = new Date();

    document.getElementById("currentDate").innerHTML =
        now.toLocaleDateString();

    document.getElementById("currentTime").innerHTML =
        now.toLocaleTimeString();

}

setInterval(updateClock,1000);

updateClock();
</script>

</body>
</html>
